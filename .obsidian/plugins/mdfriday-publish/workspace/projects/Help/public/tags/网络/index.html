                      │\n     │                      │                        │\n     │                      │   网络恢复后            │\n     │                      ├───────────────────────\u003e│\n```\n\n### 冲突解决\n\n当多台设备同时离线修改同一文件时，可能产生冲突。Friday 采用以下策略：\n\n1. **时间戳优先**: 保留最新的修改\n2. **冲突副本**: 创建冲突版本供用户选择\n3. **智能合并**: 对于某些类型的修改，尝试自动合并\n\n\u003e [!example] 冲突解决示例\n\u003e \n\u003e **情况**: 你在笔记本和手机上同时离线编辑 `project.md`\n\u003e \n\u003e **笔记本**: 添加了\"第三章\"\n\u003e **手机**: 添加了\"附录 A\"\n\u003e \n\u003e **恢复连接后**:\n\u003e - Friday 检测到冲突\n\u003e - 创建 `project.md` (最新版本) 和 `project (冲突 2026-02-10).md`\n\u003e - 你可以手动合并两个版本\n\n\n## 故障排查\n\n### 问题 1: 离线修改没有同步\n\n**症状**: 网络恢复后，离线期间的修改没有出现在其他设备上\n\n**可能原因**:\n- 离线追踪未启用\n- 重连失败但你没注意到\n- 本地数据库损坏\n\n**解决方案**:\n1. 检查状态栏图标，确认已重连\n2. 手动触发同步（点击状态栏图标）\n3. 检查开发者控制台的错误信息\n4. 如果问题持续，尝试[[reset|重置云端数据]]\n\n### 问题 2: 频繁在线/离线切换\n\n**症状**: 状态栏图标频繁在\"已连接\"和\"离线\"之间切换\n\n**可能原因**:\n- 网络连接不稳定\n- 服务器响应慢\n- 服务器配置问题\n\n**解决方案**:\n1. 检查网络连接质量\n2. 增加连接超时时间\n3. 检查 CouchDB 服务器日志\n4. 考虑切换到更稳定的网络或服务器\n\n### 问题 3: 离线模式下创建的文件有重复\n\n**症状**: 恢复连接后，同一文件出现多个副本\n\n**可能原因**:\n- 多台设备同时离线创建了同名文件\n- 时间戳同步问题\n\n**解决方案**:\n1. 手动比对和合并重复文件\n2. 确保所有设备的系统时间正确\n3. 使用唯一的文件名（如包含时间戳）\n\n## 最佳实践\n\n1. **信任离线模式**: 不要因为看到\"离线模式\"就停止工作\n2. **保持设备时间准确**: 有助于冲突解决\n3. **定期连接网络**: 虽然可以长期离线，但定期同步更安全\n4. **留意冲突通知**: 及时处理冲突文件\n\n\n\u003e [!info]\n\u003e 这些功能还在规划中，可能会在未来的版本中实现。\n\n","tagNames":["同步","离线","功能"],"links":["sync/reset"],"tags":["tags/功能","tags/离线","tags/同步"]},"sync/reset": {"slug":"sync/reset","url":"https://share.mdfriday.com/s/GfifWM/sync/reset.html","title":"重置","content":"---\ntitle: 重置\ndate: 2026-02-10\ntags:\n  - 同步\n  - 重置\n---\n如果因为密码丢失，或者是想重新开始。\n可以通过重置云端数据，来达到目的。\n\n## 操作步骤\n\n进入设置页面，找到重置数据栏，输入 `RESET` 字样，点击`重置云端数据`按钮，进行重置。\n\n\n\u003e [!danger] 重置会影响所有设备\n\u003e \n\u003e 重置后，**新的加密密码会生成**\n\n![[reset.png]]\n\n## 子设备想重新同步\n\n如果你（或其他人）重置了云端数据：\n\n1. 服务器端的 `_local/salt` 文档凭证会丢失\n2. Friday 无法验证 PBKDF2 salt，也就是无法正常打开被加密的文档，因为锁的钥匙换了\n3. 需要重新初始化\n\n**恢复步骤**:\n\n\u003e [!info] 拉取策略\n\u003e \n\u003e 重新从云端拉取数据，只会拉取云端最新数据。\n\u003e 本地数据会在修改后上传，并不会上传所有本地数据。\n\u003e 所以建议新建仓库进行同步。\n\u003e \n\u003e 因为**重新生成了加密密码**，所以从云端拉取数据前，请输入新的密码。\n\n```mermaid\ngraph TD\n    A[检测到数据库重置] --\u003e B{有本地数据?}\n    B --\u003e|是| C[重新上传本地到云端]\n    B --\u003e|否| D[从备份恢复]\n    \n    C --\u003e E[重新生成 salt]\n    D --\u003e F[导入备份]\n    \n    E --\u003e G[恢复同步]\n    F --\u003e G\n```\n\n","tagNames":["同步","重置"],"links":[],"tags":["tags/重置","tags/同步"]},"sync/settings": {"slug":"sync/settings","url":"https://share.mdfriday.com/s/GfifWM/sync/settings.html","title":"设置","content":"---\ntitle: 设置\ntags:\n  - 设置\n  - 同步\n---\n## 第一台设备设置\n\n### 步骤 1：激活 License\n\n1. 打开 **设置** → **Friday**\n2. 在激活码区域输入你的 Key\n3. 点击 **激活** 按钮\n4. 等待激活成功\n\n### 步骤 2：保存加密密码 ⚠️\n\n\u003e [!danger] 极其重要！\n\u003e \n\u003e 激活后，系统会自动生成一个 **24 位的加密密码**。  \n\u003e 这个密码用于加密你的所有数据。**丢失后无法恢复！**\n\n激活后，在「安全」区域你会看到：\n\n```\n加密密码: ************************\n         [显示密码] [复制]\n```\n\n**请立即执行以下操作：**\n\n1. 点击 **显示密码** 按钮\n2. **复制** 密码\n3. 保存到安全的地方：\n   - 密码管理器（推荐）\n   - 写在纸上并妥善保管\n   - 发送到自己的邮箱\n\n### 步骤 3：上传本地数据到云端\n\n保存好密码后：\n\n1. 找到「同步」区域\n2. 点击 **上传本地到云端** 按钮\n3. 等待上传完成\n\n上传过程中会显示进度，完成后有成功提示。\n\n---\n\n## 上传完成后\n\n上传成功后，同步会自动开始：\n\n- 状态栏显示同步图标\n- 新建、修改、删除的文件自动同步到云端\n- 你可以在其他设备上下载这些数据\n\n---\n\n## 验证同步状态\n\n你可以通过以下方式确认同步正常工作：\n\n1. **状态栏图标**：正常同步时显示⚡️图标，完成后会显示休眠图标\n2. **测试**：修改一个文件，观察是否自动同步\n\n\n## 第二台设备设置\n\n### 步骤 1：激活 License\n\n1. 在新设备上，打开 **设置** → **Friday**\n2. 输入你的 License Key（与第一台设备相同）\n3. 点击 **Activate** 按钮\n4. 等待激活成功\n\n### 步骤 2：输入加密密码\n\n激活后，系统检测到云端已有数据，会显示：\n\n- 「安全」区域显示 **加密密码** 输入框\n- 「同步」区域显示 **从云端下载** 按钮\n\n**步骤：**\n\n1. 在「加密密码」输入框中，输入你从第一台设备上保存的密码\n2. 确保密码正确\n\n### 步骤 3：从云端下载数据\n\n1. 点击 **从云端下载** 按钮\n2. 等待下载完成\n3. 成功后，你的笔记会出现在 Obsidian 中\n\n---\n\n## 下载过程\n\n下载时：\n\n1. **连接云端**：建立与同步服务器的连接\n2. **验证密码**：使用你的加密密码解密\n3. **下载文件**：将所有笔记下载到本地\n4. **写入磁盘**：将解密后的文件写入 Obsidian 仓库\n\n\u003e [!info] 下载时间\n\u003e \n\u003e 取决于仓库大小和网络速度。几百篇笔记通常在几分钟内完成。\n\n---\n\n## 下载完成后\n\n下载成功后：\n\n- ✅ 你的笔记出现在 Obsidian 文件列表中\n- ✅ 同步自动开始\n- ✅ 之后的更改会在设备之间自动同步\n\n---\n\n## 多设备使用技巧\n\n### 同步是双向的\n\n- 设备 A 的更改同步到设备 B\n- 设备 B 的更改同步到设备 A\n- 同步是实时的（取决于网络）\n\n### 推荐的工作流程\n\n1. **更改后等几秒**：确保同步完成\n2. **切换设备前检查**：确认同步图标显示正常\n3. **避免同时编辑同一文件**：虽然冲突会被处理，但最好避免\n","tagNames":["设置","同步"],"links":[],"tags":["tags/同步","tags/设置"]},"tags": {"slug":"tags","url":"https://share.mdfriday.com/s/GfifWM/tags/index.html","title":"tag","content":"","tagNames":[],"links":[],"tags":[]},"tags/hugo": {"slug":"tags/hugo","url":"https://share.mdfriday.com/s/GfifWM/tags/hugo/index.html","title":"hugo","content":"","tagNames":[],"links":[],"tags":[]},"tags/主题": {"slug":"tags/主题","url":"https://share.mdfriday.com/s/GfifWM/tags/主题/index.html","title":"主题","content":"","tagNames":[],"links":[],"tags":[]},"tags/买断": {"slug":"tags/买断","url":"https://share.mdfriday.com/s/GfifWM/tags/买断/index.html","title":"买断","content":"","tagNames":[],"links":[],"tags":[]},"tags/产品": {"slug":"tags/产品","url":"https://share.mdfriday.com/s/GfifWM/tags/产品/index.html","title":"产品","content":"","tagNames":[],"links":[],"tags":[]},"tags/企业": {"slug":"tags/企业","url":"https://share.mdfriday.com/s/GfifWM/tags/企业/index.html","title":"企业","content":"","tagNames":[],"links":[],"tags":[]},"tags/作品集": {"slug":"tags/作品集","url":"https://share.mdfriday.com/s/GfifWM/tags/作品集/index.html","title":"作品集","content":"","tagNames":[],"links":[],"tags":[]},"tags/分享": {"slug":"tags/分享","url":"https://share.mdfriday.com/s/GfifWM/tags/分享/index.html","title":"分享","content":"","tagNames":[],"links":[],"tags":[]},"tags/功能": {"slug":"tags/功能","url":"https://share.mdfriday.com/s/GfifWM/tags/功能/index.html","title":"功能","content":"","tagNames":[],"links":[],"tags":[]},"tags/加密": {"slug":"tags/加密","url":"https://share.mdfriday.com/s/GfifWM/tags/加密/index.html","title":"加密","content":"","tagNames":[],"links":[],"tags":[]},"tags/博客": {"slug":"tags/博客","url":"https://share.mdfriday.com/s/GfifWM/tags/博客/index.html","title":"博客","content":"","tagNames":[],"links":[],"tags":[]}, 主题","content":"---\ntitle: 主题\n---\n","tagNames":[],"links":[],"tags":[]},"themes/blog": {"slug":"themes/blog","url":"https://share.mdfriday.com/s/GfifWM/themes/blog.html","title":"博客","content":"---\ntitle: 博客\ndate: 2026-02-11\ntags:\n  - 主题\n  - 博客\n---\n努力更新中...","tagNames":["主题","博客"],"links":[],"tags":["tags/博客","tags/主题"]},"themes/community": {"slug":"themes/community","url":"https://share.mdfriday.com/s/GfifWM/themes/community.html","title":"社区","content":"---\ntitle: 社区\ndate: 2026-02-11\ntags:\n  - hugo\n  - 主题\n---\n\nFriday 完全重写了 HUGO 的核心代码（使用 TypeScript），因此能够**快速适配 HUGO 主题生态**，让你可以直接挑选 **500+ HUGO 主题**。\n\n## 🌟 为什么选择 HUGO 主题生态？\n\n### 背靠成熟社区\n\nHUGO 是世界上最流行的静态网站生成器之一：\n\n| 特性           | 数据       |\n| ------------ | -------- |\n| GitHub Stars | 86.5k+ ⭐ |\n| 主题数量         | 500+ 🎨  |\n| 社区活跃度        | 非常高 📈   |\n| 文档完善度        | 极佳 📚    |\n| 更新频率         | 持续维护 🔄  |\n\n\u003e [!success] Friday 的创新\n\u003e \n\u003e Friday 使用 TypeScript 完全重写了 HUGO 核心，让你能够：\n\u003e - ✅ 在 Obsidian 中直接使用 HUGO 主题\n\u003e - ✅ 无需学习 HUGO 命令行\n\u003e - ✅ 可视化预览和发布\n\u003e - ✅ 享受 500+ 主题生态\n\n## 🎨 主题分类\n\n### 按用途分类\n\n```mermaid\ngraph TB\n    Themes[HUGO 主题库\u003cbr/\u003e500+ 主题] --\u003e Cat1[知识管理]\n    Themes --\u003e Cat2[内容发布]\n    Themes --\u003e Cat3[个人品牌]\n    Themes --\u003e Cat4[商业用途]\n    \n    Cat1 --\u003e Wiki[Wiki 主题]\n    Cat1 --\u003e Doc[文档主题]\n    \n    Cat2 --\u003e Blog[博客主题]\n    Cat2 --\u003e News[新闻主题]\n    \n    Cat3 --\u003e Portfolio[作品集]\n    Cat3 --\u003e Resume[简历主题]\n    \n    Cat4 --\u003e Landing[产品官网]\n    Cat4 --\u003e Enterprise[企业站]\n    \n    style Themes fill:#f96,stroke:#333,stroke-width:2px\n```\n\n\n### 自定义主题\n\nFriday 支持自定义主题样式：\n\n**基础自定义**（所有用户）：\n- 🎨 配色方案\n- 📝 字体选择\n- 🖼️ Logo 和 Favicon\n- 📋 站点信息\n\n**高级自定义**（Pro 用户）：\n- 💻 自定义 CSS\n- 📄 修改模板\n- 🔧 配置文件\n- 🎯 高级功能\n\n## 📊 主题对比\n\n### Friday vs HUGO 原生\n\n| 特性 | HUGO 原生 | Friday |\n|------|----------|--------|\n| 主题数量 | 500+ | 500+ |\n| 学习曲线 | 陡峭 | 平缓 |\n| 使用方式 | 命令行 | 可视化 |\n| 预览方式 | 本地服务器 | [[../publish/preview\\|一键预览]] |\n| 编辑器 | 任意 | Obsidian 原生 |\n| 发布方式 | 手动/CI | [[../publish/quick-share\\|一键发布]] |\n\n### Friday 的优势\n\n\u003e [!success] 零学习成本\n\u003e \n\u003e 不需要学习 HUGO：\n\u003e - ❌ 无需学习命令行\n\u003e - ❌ 无需配置文件\n\u003e - ❌ 无需手动部署\n\u003e \n\u003e 只需在 Obsidian 中：\n\u003e - ✅ 写 Markdown\n\u003e - ✅ 选主题\n\u003e - ✅ 一键发布\n\n## 🔍 主题搜索\n\n### 按关键词搜索\n\n在 Friday 主题库中，你可以：\n\n- 🔍 搜索主题名称\n- 🏷️ 按标签筛选\n- 📊 按热度排序\n- ⭐ 按评分排序\n- 📅 按更新时间排序\n\n### 推荐算法\n\nFriday 会根据你的：\n\n- 📝 笔记类型\n- 🎨 使用场景\n- 👀 浏览历史\n- ⭐ 收藏记录\n\n推荐适合你的主题。\n\n## 🎓 主题使用指南\n\n### 选择主题的建议\n\n\u003e [!tip] 如何选择主题？\n\u003e \n\u003e **考虑因素**：\n\u003e 1. **内容类型**：博客？文档？作品集？\n\u003e 2. **目标受众**：技术人员？普通读者？客户？\n\u003e 3. **品牌形象**：专业？创意？简约？\n\u003e 4. **功能需求**：搜索？评论？多语言？\n\u003e \n\u003e **建议**：\n\u003e - 先用默认主题熟悉流程\n\u003e - 再尝试不同风格的主题\n\u003e - 最后选定最合适的\n\n### 常见主题类型对比\n\n| 类型 | 优势 | 劣势 | 适合场景 |\n|------|------|------|---------|\n| Wiki | 导航清晰 | 较传统 | 知识库、团队文档 |\n| Blog | 时间线明确 | 内容更新频繁 | 个人博客、新闻 |\n| Doc | 结构化强 | 灵活性低 | 产品文档、手册 |\n| Portfolio | 视觉冲击强 | 内容承载少 | 设计作品、摄影 |\n| Landing | 转化率高 | 信息密度大 | 产品推广、营销 |\n\n## 🌐 主题生态\n\n### HUGO 社区资源\n\n**官方资源**：\n- 📖 [HUGO 官方文档](https://gohugo.io/documentation/)\n- 🎨 [HUGO 主题市场](https://themes.gohugo.io/)\n- 💬 [HUGO 论坛](https://discourse.gohugo.io/)\n- 📺 [视频教程](https://www.youtube.com/results?search_query=hugo+tutorial)\n\n**第三方资源**：\n- 🎓 教程和博客文章\n- 🛠️ 主题开发工具\n- 📦 插件和扩展\n- 👥 开发者社区\n\n### Friday 社区\n\n**主题分享**：\n- [[showcases/awesome|优秀案例展示]]\n- 用户自定义主题\n- 主题使用技巧\n- 最佳实践分享\n\n## 💡 主题定制服务\n\n### 自助定制\n\n**免费**（所有用户）：\n- 基础配色\n- 字体选择\n- Logo 替换\n- 基本信息\n\n**Pro**（付费用户）：\n- 自定义 CSS\n- 模板修改\n- 高级配置\n- 技术支持\n\n### 专业定制\n\n如果需要深度定制：\n\n- 🎨 **主题设计**：¥2,000 起\n- 💻 **主题开发**：¥5,000 起\n- 🔧 **功能开发**：面议\n- 📞 **联系**：design@mdfriday.com\n\n## 📈 主题趋势\n\n### 2026 年流行趋势\n\n1. **极简主义**\n   - 更少的视觉元素\n   - 专注于内容本身\n   - 快速加载\n\n2. **暗色模式**\n   - 自动切换\n   - 保护视力\n   - 节省电量\n\n3. **响应式设计**\n   - 完美适配所有设备\n   - 触屏优化\n   - PWA 支持\n\n4. **可访问性**\n   - 无障碍设计\n   - 语义化 HTML\n   - 键盘导航\n\n## ❓ 常见问题\n\n### Q: 所有 HUGO 主题都支持吗？\n\n**A**: 大部分支持！\n\n- ✅ 95% 的 HUGO 主题可直接使用\n- ⚠️ 少数需要特殊配置\n- 🔧 我们持续增加兼容性\n\n### Q: 可以使用第三方主题吗？\n\n**A**: 可以！\n\n1. 从 HUGO 主题市场下载\n2. 上传到 Friday\n3. 应用主题\n\n或联系我们帮助适配。\n\n### Q: 主题可以切换吗？\n\n**A**: 随时可以！\n\n- 不影响内容\n- 保留所有数据\n- 即时生效\n\n### Q: 主题更新如何处理？\n\n**A**: 自动更新！\n\n- 主题开发者更新后\n- Friday 自动同步\n- 你的站点自动使用最新版\n\n## 🔗 相关文档\n\n- [[wiki|Wiki 主题详解]]\n- [[blog|博客主题详解]]\n- [[document|文档主题详解]]\n- [[portfolio|作品集主题]]\n- [[../publish/preview|本地预览]]\n- [[../publish/quick-share|快速发布]]\n- [[../friday|关于 Friday]]\n\n## 🎉 开始使用\n\n\u003e [!success] 立即体验\n\u003e \n\u003e 1. [[../get-started|安装 Friday]]\n\u003e 2. [[../license/activation|激活 License]]\n\u003e 3. 浏览主题库\n\u003e 4. [[../publish/quick-share|发布第一篇]]\n\n**500+ 主题等你探索！开始创作吧！🎨✨**\n\n","tagNames":["hugo","主题"],"links":["publish/preview","publish/quick-share","showcases/awesome","themes/wiki","themes/blog","themes/document","themes/portfolio","friday","get-started","license/activation"],"tags":["tags/主题","tags/hugo"]},"themes/document": {"slug":"themes/document","url":"https://share.mdfriday.com/s/GfifWM/themes/document.html","title":"文档","content":"---\ntitle: 文档\ndate: 2026-02-11\ntags:\n  - 主题\n  - 文档\n---\n努力更新中...\n\n","tagNames":["主题","文档"],"links":[],"tags":["tags/文档","tags/主题"]},"themes/intro": {"slug":"themes/intro","url":"https://share.mdfriday.com/s/GfifWM/themes/intro.html","title":"简介","content":"---\ntitle: 简介\ndate: 2026-02-11\ntags:\n  - 主题\n  - 简介\n---\n\n## 🛠️ 如何使用主题\n\n### 在 Friday 中选择主题\n\n```mermaid\ngraph LR\n    A[打开 Friday 设置] --\u003e B[进入发布选项]\n    B --\u003e C[浏览主题库]\n    C --\u003e D[预览主题]\n    D --\u003e E{喜欢?}\n    E --\u003e|是| F[应用主题]\n    E --\u003e|否| C\n    F --\u003e G[发布站点]\n```\n\n**步骤**：\n\n1. **浏览主题**\n   - 打开 **设置 → Friday → 发布**\n   - 点击\"浏览主题\"\n   - 按类别筛选\n\n2. **预览主题**\n   - 点击主题卡片\n   - 查看演示站点\n   - 了解主题特点\n\n3. **应用主题**\n   - 点击\"使用此主题\"\n   - [[publish/preview|本地预览]]效果\n   - 满意后发布\n\n","tagNames":["主题","简介"],"links":["publish/preview"],"tags":["tags/简介","tags/主题"]},"themes/landing": {"slug":"themes/landing","url":"https://share.mdfriday.com/s/GfifWM/themes/landing.html","title":"产品官网","content":"---\ntitle: 产品官网\ndate: 2026-02-11\ntags:\n  - 主题\n  - 产品\n  - 市场营销\n---\n\n努力更新中...\n\n","tagNames":["主题","产品","市场营销"],"links":[],"tags":["tags/市场营销","tags/产品","tags/主题"]},"themes/portfolio": {"slug":"themes/portfolio","url":"https://share.mdfriday.com/s/GfifWM/themes/portfolio.html","title":"作品集","content":"---\ntitle: 作品集\ndate: 2026-02-11\ntags:\n  - 主题\n  - 作品集\n---\n努力更新中...","tagNames":["主题","作品集"],"links":[],"tags":["tags/作品集","tags/主题"]},"themes/resume": {"slug":"themes/resume","url":"https://share.mdfriday.com/s/GfifWM/themes/resume.html","title":"简历","content":"---\ntitle: 简历\ndate: 2026-02-11\ntags:\n  - 主题\n  - 简历\n---\n\n努力更新中...","tagNames":["主题","简历"],"links":[],"tags":["tags/简历","tags/主题"]},"themes/wiki": {"slug":"themes/wiki","url":"https://share.mdfriday.com/s/GfifWM/themes/wiki.html","title":"知识库","content":"---\ntitle: 知识库\ndate: 2026-02-11\ntags:\n  - 主题\n  - 知识库\n---\n努力更新中...","tagNames":["主题","知识库"],"links":[],"tags":["tags/知识库","tags/主题"]},"index": {"slug":"index","url":"https://share.mdfriday.com/s/GfifWM/index.html","title":"欢迎使用 Friday","content":"---\ntitle: 欢迎使用 Friday\n---\nFriday 是一款 Obsidian 插件，让你的笔记在多设备间安全同步，并能一键发布到互联网。\n\n\u003e [!quote] 你是创作者，也是拥有者。\n\u003e\n\u003e **Friday 是一个面向知识创作者的「内容编译器与发布平台」，  \n\u003e 让一篇 Markdown 成为可部署的网站、演示文稿、文档与品牌资产。**\n\n## 🪴 快速开始\n\n### 第一次使用 Friday？\n\n[[get-started|快速开始]] • [[friday|关于 Friday]] • [[faq|常见问题]]\n\n\u003e [!tip] 激活码\n\u003e\n\u003e - [套餐详情](https://mdfriday.com/zh/pricing.html)\n\u003e - [淘宝购买](https://item.taobao.com/item.htm?id=1021681636191\u0026mi_id=0000TP6GHQep6drq4_kU9DP4zK01apQ5i_06dEQlgeN7KZI\u0026skuId=6196046574887\u0026spm=a21xtw.29178619.0.0\u0026xxc=shop)\n\u003e - [体验码领取](https://mdfriday.com/zh/tiyan.html)\n\u003e - [[license/activation|激活]]\n\u003e - [[license/custom|私有化部署]]\n\n### 多设备同步\n\n可支持多设备同步，手机、电脑无缝协作。\n\n1. [[sync/settings##第一台设备设置|第一台设备设置]]\n2. [[sync/settings##第二台设备设置|第二台设备设置]]\n\n[[friday|Friday]] 多设备同步核心功能，让你的创作安全，高效：\n\n- [[sync/intro|安全同步]]：端到端加密的多设备同步，使用行业标准[[sync/encryption|加密算法]]保护你的隐私。\n- 支持[[sync/offline-mode|离线模式]]，网络断开也能继续工作，[[sync/server-connectivity|智能连接管理]]，网络恢复后，自动重连，同步无忧。\n\n### 站点发布\n\n[[friday|Friday]] 发布核心功能，让你的创作轻分享给更多人，建立连接，打造个人品牌，自然变现：\n\n海量主题生态，开箱即用，[[themes/community|500+ 社区主题]]背书。\n[[themes/wiki|知识库]]，[[themes/document|文档]]，[[themes/blog|博客]]，[[themes/portfolio|作品集]]，[[themes/resume|简历]]，[[themes/ppt|PPT]]，[[themes/landing|产品官网]]，[[themes/enterprise|企业站]] 等等。\n\n丰富的发布方式，满足不同需求。\n提供[[publish/quick-share|快速分享]]，[[publish/subdomain|二级域名]]，[[publish/custom-domain|自定义域名]]，[[publish/enterprise-domain|企业域名]]多种发布方式。支持[[publish/preview|本地预览]]，所有数据和构建过程都在本地完成，不上传任何数据，安全可靠。[[publish/wysiwyg|所见即所得]]，降低学习成本。搭配 [[sync/intro|同步功能]]，适合个人与团队协作，快速发布。\n\n## 📚 深入了解\n\n想了解 Friday 的设计理念和技术细节？\n\n- [[architecture/overview|架构概览]]","tagNames":[],"links":["get-started","friday","faq","license/activation","license/custom","sync/settings","sync/intro","sync/encryption","sync/offline-mode","sync/server-connectivity","themes/community","themes/wiki","themes/document","themes/blog","themes/portfolio","themes/resume","themes/ppt","themes/landing","themes/enterprise","publish/quick-share","publish/subdomain","publish/custom-domain","publish/enterprise-domain","publish/preview","publish/wysiwyg","architecture/overview"],"tags":[]}}};
