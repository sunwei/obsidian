    pages: pages,content: {"publish/intro": {"slug":"publish/intro","url":"https://share.mdfriday.com/s/GfifWM/publish/intro.html","title":"介绍","content":"---\ntitle: 介绍\nweight: 0\ntags:\n  - 简介\n  - 发布\n---\n\n# 一次创作，多种发布\n\nFriday 让你的笔记不只是笔记——它们可以成为知识库、博客、网站、简历、PPT、作品集，甚至是公司官方，都可以帮助你打造你自己的品牌。\n\n","tagNames":["简介","发布"],"links":[],"tags":["tags/发布","tags/简介"]},"publish/quick-share": {"slug":"publish/quick-share","url":"https://share.mdfriday.com/s/GfifWM/publish/quick-share.html","title":"快速分享","content":"---\ntitle: 快速分享\nweight: 1\ntags:\n  - 发布\n  - 分享\n---\n\n# 快速分享\n\n快速分享是 Friday 最简单的发布方式——只需一键，你的笔记就能在网上访问。\n\n---\n\n## 什么是快速分享？\n\n快速分享让你可以：\n- 🚀 **一键发布** 单篇 Markdown 笔记\n- 🔗 **获取链接** 分享给任何人\n- ⚡ **即时可用** 几秒钟内完成\n\n---\n\n## 使用前提\n\n- ✅ Friday License 已激活\n- ✅ 当前正在查看一个 Markdown 文件\n\n---\n\n## 使用方法\n\n### 步骤 1：打开笔记\n\n在 Obsidian 中打开你想分享的 Markdown 笔记。\n\n### 步骤 2：点击地球图标\n\n在笔记的右上角，你会看到一个 **🌐 地球图标**。点击它。\n\n\u003e [!info] 找不到地球图标？\n\u003e \n\u003e 确保你正在查看 Markdown 文件（.md），并且 Friday 插件已启用。\n\n### 步骤 3：等待构建\n\n点击后，Friday 会自动：\n\n1. 打开右侧面板\n2. 设置分享模式的 SitePath\n3. 将你的笔记构建为网页\n4. 准备发布到 MDFriday Share\n\n你会看到进度指示。\n\n### 步骤 4：发布和分享\n\n构建完成后：\n\n1. 浏览器自动打开预览页面\n2. 发布选项自动选择 \"MDFriday Share\"\n3. 点击 **发布** 按钮\n4. 复制生成的链接并分享\n\n---\n\n## 链接格式\n\n快速分享的链接格式为：\n\n```\nhttps://mdfriday.com/s/{用户目录}/{预览ID}/\n```\n\n示例：\n```\nhttps://mdfriday.com/s/abc123/xyz789/\n```\n\n---\n\n## 注意事项\n\n### 内容可见性\n\n- 快速分享的内容是 **公开可访问** 的\n- 任何有链接的人都可以查看\n- 不要分享敏感或私密信息\n\n### 链接有效期\n\n- 链接在发布后立即生效\n- 目前没有自动过期\n- 删除功能正在开发中\n\n### 图片和附件\n\n- 笔记中的图片会自动处理并上传\n- 支持 Obsidian 的内部链接格式\n- 大文件可能需要更长的构建时间\n\n","tagNames":["发布","分享"],"links":[],"tags":["tags/分享","tags/发布"]},"publish/right-panel": {"slug":"publish/right-panel","url":"https://share.mdfriday.com/s/GfifWM/publish/right-panel.html","title":"右侧面板","content":"---\ntitle: 右侧面板\nweight: 2\ntags:\n  - 发布\n---\n\n# 右侧面板\n\n右侧面板是 Friday 的主要操作区域，让你完全控制网站的构建和发布。\n\n---\n\n## 打开面板\n\n两种方式打开右侧面板：\n\n### 方式一：右键菜单\n\n1. 在文件列表中，右键点击一个 **文件夹** 或 **Markdown 文件**\n2. 选择 **发布到网络**\n\n### 方式二：命令面板\n\n1. 按 `Ctrl/Cmd + P` 打开命令面板\n2. 搜索 \"Friday\" 或 \"Publish\"\n3. 选择相应的命令\n\n---\n\n## 面板区域说明\n\n右侧面板从上到下包含以下部分：\n\n### 1️⃣ 多语言内容\n\n这个区域管理你的网站内容来源。\n\n| 元素 | 说明 |\n|------|------|\n| **内容路径** | 显示你选择的文件夹或文件名 |\n| **语言选择** | 为每个内容设置语言（中文、英文等） |\n| **Default** 标签 | 表示主要语言版本 |\n| **Clear** 按钮 | 移除所有已选内容 |\n| **×** 按钮 | 移除单个语言版本（多语言时显示） |\n\n**多语言支持：**\n\nFriday 支持多语言网站。如果你有多种语言的内容：\n\n1. 首先添加主要语言内容文件夹\n2. 右键其他语言文件夹并选择 \"Publish to Web\" 来添加它们\n3. 为每个内容设置正确的语言\n\n### 2️⃣ 站点名称\n\n输入你的网站标题，显示在网站头部。\n\n```\n站点名称: [我的博客          ]\n```\n\n### 3️⃣ 站点资源\n\n管理静态资源（图片、CSS、JS 等）。\n\n- 显示当前设置的资源文件夹\n- 点击 \"Clear Assets\" 移除\n\n**设置站点资源：**\n\n1. 在文件列表中右键点击一个文件夹\n2. 选择 **Set as Site Assets**\n3. 该文件夹中的文件会被复制到 `/static` 目录\n\n### 4️⃣ 高级设置\n\n点击展开更多配置选项：\n\n| 设置 | 说明 | 示例 |\n|------|------|------|\n| **Site Path (SitePath)** | 网站的 URL 路径 | `/`、`/blog`、`/s/xxx/yyy` |\n| **Site Password** | 设置访问密码 | 留空表示公开 |\n| **Google Analytics ID** | 流量分析 | `G-XXXXXXXXXX` |\n| **Disqus Shortname** | 评论系统 | `your-site-name` |\n\n\n### 5️⃣ 主题选择\n\n选择网站的视觉风格。\n\n- **当前主题名称**：显示已选主题\n- **Change Theme** 按钮：打开主题选择器\n- **Download Sample** 按钮：下载主题示例内容（如果有）\n\n\n### 6️⃣ 预览\n\n发布前预览网站。\n\n- **Generate Preview** / **Regenerate Preview** 按钮\n- 进度条显示构建进度\n- 预览链接（构建后显示）\n- **Export Site** 按钮（下载为 ZIP）\n\n\n### 7️⃣ 发布\n\n将网站发布到互联网。\n\n- **发布方式** 下拉框：选择发布平台\n- 平台配置区域（根据选择变化）\n- **Publish** 按钮\n\n\n---\n\n## 典型工作流程\n\n### 发布文件夹\n\n1. 右键内容文件夹 → **Publish to Web**\n2. 输入站点名称\n3. （可选）设置站点资源文件夹\n4. 选择主题\n5. 点击 **Generate Preview** → 检查效果\n6. 选择发布方式 → 点击 **Publish**\n\n### 发布单个文件\n\n1. 右键 Markdown 文件 → **Publish to Web**\n2. 输入站点名称\n3. 选择适合单页的主题（如 Note）\n4. 生成预览 → 发布\n\n### 创建多语言网站\n\n1. 准备多语言内容文件夹（如 `content`、`content.zh`）\n2. 右键主文件夹 → **Publish to Web**\n3. 右键其他语言文件夹 → **Publish to Web**（作为新语言添加）\n4. 为每个内容设置正确的语言\n5. 生成预览 → 发布\n\n---\n\n## 智能文件夹检测\n\nFriday 自动检测 Hugo 风格的文件夹结构：\n\n```\nmy-site/\n├── content/      → 自动检测为英文内容\n├── content.zh/   → 自动检测为中文内容\n└── static/       → 自动检测为站点资源\n```\n\n当你右键点击这种结构的父文件夹时，Friday 会自动配置所有内容和资源。\n\n\n","tagNames":["发布"],"links":[],"tags":["tags/发布"]},"publish": {"slug":"publish","url":"https://share.mdfriday.com/s/GfifWM/publish/index.html","title":"发布","content":"---\ntitle: 发布\nweight: 3\n---\n\n","tagNames":[],"links":[],"tags":[]},"publish/preview": {"slug":"publish/preview","url":"https://share.mdfriday.com/s/GfifWM/publish/preview.html","title":"本地预览","content":"---\ntitle: 本地预览\nweight: 4\ntags:\n  - 发布\n  - 预览\n---\n\n# 本地预览\n\n发布之前，预览功能让你确保网站效果符合预期。\n\n---\n\n## 为什么要预览？\n\n- ✅ **检查布局**：确保内容正确显示\n- ✅ **验证链接**：确保内部链接正常工作\n- ✅ **查看样式**：确认主题效果符合预期\n- ✅ **测试功能**：检查导航、搜索等功能\n\n---\n\n## 生成预览\n\n### 步骤\n\n1. 在右侧面板完成内容和主题配置\n2. 点击 **生成预览** 按钮\n3. 等待构建完成（显示进度条）\n4. 成功后，浏览器自动打开预览页面\n\n## 预览链接\n\n构建完成后，你会看到预览链接：\n\n```\nPreview Link\nhttp://localhost:8090/\n```\n\n点击链接在浏览器中查看。\n\n\u003e [!info] 关于端口\n\u003e \n\u003e 默认使用 8090 端口。如果被占用，系统会自动选择其他端口。\n\n---\n\n## 实时重载\n\nFriday 支持 **实时重载**：\n\n1. 保持预览页面打开\n2. 修改你的笔记内容\n3. 保存后，预览页面自动刷新\n\n实时看到你的更改！\n\n---\n\n## 重新生成预览\n\n如果你：\n- 修改了内容\n- 更换了主题\n- 调整了配置\n\n点击 **Regenerate Preview** 按钮来更新。\n\n---\n\n## 导出站点\n\n预览满意后，你可以将网站导出为 ZIP 文件：\n\n1. 点击 **Export Site** 按钮\n2. 选择保存位置\n3. 获得包含完整网站文件的 ZIP 压缩包\n\n导出的 ZIP 可以：\n- 上传到任何静态托管服务\n- 部署到你自己的服务器\n- 作为备份保存\n\n---\n\n## 预览目录结构\n\n预览文件保存在插件目录中：\n\n```\n.obsidian/plugins/friday/preview/\n└── {preview-id}/\n    ├── config.json      # 站点配置\n    ├── content/         # 内容文件\n    └── public/          # 生成的网站文件\n```\n\n\u003e [!warning] 注意\n\u003e \n\u003e 预览文件是临时的，可能会被清理。使用导出功能来保留它们。\n","tagNames":["发布","预览"],"links":[],"tags":["tags/预览","tags/发布"]},"publish/site-path": {"slug":"publish/site-path","url":"https://share.mdfriday.com/s/GfifWM/publish/site-path.html","title":"多站点指南","content":"---\ntitle: 多站点指南\nweight: 5\ntags:\n  - 发布\n  - 多站点\n---\n\n## 站点路径\n\n站点路径决定了你的网站在 URL 中的位置。正确配置 SitePath 对网站正常运行至关重要。\n\n---\n\n## 什么是站点路径？\n\n站点路径是网站的 **基础 URL 路径**。\n\n\u003e [!success] 所有发布方式都支持站点路径\n\n示例：\n- SitePath `/` → 网站在 `https://example.com/`\n- SitePath `/blog` → 网站在 `https://example.com/blog/`\n- SitePath `/docs/v2` → 网站在 `https://example.com/docs/v2/`\n\n---\n\n## 为什么站点路径很重要\n\n站点路径影响：\n\n| 方面 | 影响 |\n|------|------|\n| **页面链接** | 所有内部链接根据 SitePath 生成 |\n| **资源路径** | CSS、JS、图片加载路径 |\n| **导航** | 菜单、面包屑链接 |\n| **SEO** | 搜索引擎索引的 URL 结构 |\n\n\u003e [!danger] SitePath 错误 = 网站崩溃\n\u003e \n\u003e 如果 SitePath 配置错误：\n\u003e - 页面无法加载\n\u003e - 样式丢失（显示为纯文本）\n\u003e - 链接返回 404 错误\n\n\n\n","tagNames":["发布","多站点"],"links":[],"tags":["tags/多站点","tags/发布"]},"architecture": {"slug":"architecture","url":"https://share.mdfriday.com/s/GfifWM/architecture/index.html","title":"架构","content":"---\ntitle: 架构\n---\n\n深入了解 Friday 插件的技术架构和设计理念。\n\n","tagNames":[],"links":[],"tags":[]},"architecture/overview": {"slug":"architecture/overview","url":"https://share.mdfriday.com/s/GfifWM/architecture/overview.html","title":"架构概览","content":"---\ntitle: 架构概览\ndate: 2026-02-10\ntags:\n  - 架构\n  - 技术\n---\n\nFriday 插件采用模块化、分层的架构设计，确保代码的可维护性、可扩展性和高性能。本文档提供对 Friday 核心架构的全面概览。\n\n## 系统架构总览\n\n```mermaid\ngraph TB\n    subgraph \"用户界面层\"\n        UI[Obsidian UI]\n        StatusBar[状态栏]\n        Settings[设置面板]\n        Commands[命令面板]\n    end\n    \n    subgraph \"插件层 (Friday Plugin)\"\n        PluginMain[FridayPlugin Main]\n        SyncCore[FridaySyncCore]\n        PublishCore[FridayPublishCore]\n    end\n    \n    subgraph \"同步核心层\"\n        Replicator[LiveSyncReplicator]\n        LocalDB[LocalDB Manager]\n        StorageEventMgr[StorageEventManager]\n        ServerChecker[ServerConnectivityChecker]\n    end\n    \n    subgraph \"功能模块层\"\n        NetworkMgr[NetworkManager]\n        OfflineTracker[OfflineTracker]\n        ConnectionMonitor[ConnectionMonitor]\n        EncryptionMgr[EncryptionManager]\n    end\n    \n    subgraph \"存储层\"\n        PouchDB[(PouchDB\u003cbr/\u003eIndexedDB)]\n        CouchDB[(CouchDB\u003cbr/\u003eRemote)]\n        FileSystem[File System]\n    end\n    \n    UI --\u003e PluginMain\n    StatusBar --\u003e PluginMain\n    Settings --\u003e PluginMain\n    Commands --\u003e PluginMain\n    \n    PluginMain --\u003e SyncCore\n    PluginMain --\u003e PublishCore\n    \n    SyncCore --\u003e Replicator\n    SyncCore --\u003e LocalDB\n    SyncCore --\u003e StorageEventMgr\n    SyncCore --\u003e ServerChecker\n    \n    Replicator --\u003e NetworkMgr\n    Replicator --\u003e OfflineTracker\n    Replicator --\u003e ConnectionMonitor\n    Replicator --\u003e EncryptionMgr\n    \n    LocalDB --\u003e PouchDB\n    Replicator --\u003e PouchDB\n    Replicator --\u003e CouchDB\n    StorageEventMgr --\u003e FileSystem\n    \n    PouchDB -.双向同步.-\u003e CouchDB\n```\n\n## 分层架构\n\nFriday 采用经典的分层架构，从上到下依次为：\n\n### 1. 用户界面层 (Presentation Layer)\n\n负责与用户交互，显示状态和接收命令。\n\n| 组件 | 职责 | 文件路径 |\n|------|------|---------|\n| 设置面板 | 配置 License、服务器、加密等 | `src/ui/SettingTab.ts` |\n| 状态栏 | 显示同步状态、点击触发同步 | `src/ui/StatusBar.ts` |\n| 命令面板 | 提供快捷命令（同步、发布等） | `src/ui/Commands.ts` |\n| 通知系统 | 显示成功/错误消息 | `src/ui/Notice.ts` |\n\n\u003e [!tip]\n\u003e UI 层不包含业务逻辑，所有逻辑都委托给下层。\n\n### 2. 插件层 (Plugin Layer)\n\nFriday 插件的主入口，协调各个子系统。\n\n```typescript\nexport default class FridayPlugin extends Plugin {\n    private syncCore: FridaySyncCore | null = null;\n    private publishCore: FridayPublishCore | null = null;\n    \n    async onload() {\n        // 初始化同步核心\n        this.syncCore = new FridaySyncCore(this.app, this);\n        await this.syncCore.initialize(config);\n        \n        // 初始化发布核心\n        this.publishCore = new FridayPublishCore(this.app, this);\n        \n        // 注册 UI 组件\n        this.registerStatusBar();\n        this.registerCommands();\n        this.registerSettings();\n    }\n}\n```\n\n**核心职责**:\n- 插件生命周期管理\n- 子系统初始化和协调\n- 全局事件监听\n\n### 3. 核心业务层 (Core Business Layer)\n\n实现 Friday 的核心功能。\n\n#### FridaySyncCore\n\n同步功能的中枢，协调所有同步相关的组件。\n\n```typescript\nexport class FridaySyncCore {\n    private _replicator: LiveSyncCouchDBReplicator | null = null;\n    private _localDB: FridayLocalDB | null = null;\n    private _storageEventManager: FridayStorageEventManager | null = null;\n    private _serverChecker: ServerConnectivityChecker | null = null;\n    private _managers: FridayServiceHub | null = null;\n    \n    async startSync(continuous: boolean = true): Promise\u003cboolean\u003e {\n        // 1️⃣ 检查服务器连接性\n        const connectivity = await this._serverChecker?.checkConnectivity();\n        \n        // 2️⃣ 根据连接状态选择策略\n        if (connectivity?.status === \"REACHABLE\") {\n            // 在线模式\n            await this.startOnlineSync();\n        } else {\n            // 离线模式\n            await this.startOfflineMode();\n        }\n    }\n}\n```\n\n**关键方法**:\n- `initialize()`: 初始化所有子组件\n- `startSync()`: 启动同步流程\n- `stopSync()`: 停止同步\n- `handleOfflineMode()`: 处理离线情况\n\n#### FridayPublishCore\n\n发布功能的核心（未来将详细实现）。\n\n### 4. 功能模块层 (Feature Module Layer)\n\n独立的、可复用的功能模块。\n\n```\nsrc/sync/features/\n├── ServerConnectivity/      # 服务器连接性检查\n├── NetworkEvents/            # 网络事件监听\n├── ConnectionMonitor/        # 连接监控和重连\n├── ConnectionFailure/        # 连接失败处理\n└── OfflineTracker/           # 离线修改追踪\n```\n\n每个模块都是**自包含**的，可以独立测试和复用。\n\n\u003e [!example] 功能模块示例\n\u003e \n\u003e `ServerConnectivity` 模块：\n\u003e - 输入：服务器配置\n\u003e - 输出：连接状态（REACHABLE/UNREACHABLE）\n\u003e - 无副作用：不修改全局状态\n\u003e - 可测试：可以 mock 网络请求\n\n### 5. 存储层 (Data Layer)\n\n负责数据的持久化和检索。\n\n```mermaid\ngraph LR\n    subgraph \"本地存储\"\n        FileSystem[Obsidian\u003cbr/\u003e文件系统]\n        PouchDB[(PouchDB\u003cbr/\u003eIndexedDB)]\n    end\n    \n    subgraph \"远程存储\"\n        CouchDB[(CouchDB\u003cbr/\u003e服务器)]\n    end\n    \n    FileSystem --\u003e|变更检测| StorageEventMgr\n    StorageEventMgr --\u003e|保存| PouchDB\n    PouchDB \u003c--\u003e|复制| CouchDB\n    \n    style PouchDB fill:#f9f,stroke:#333,stroke-width:2px\n```\n\n**关键组件**:\n\n| 组件 | 技术 | 用途 |\n|------|------|------|\n| PouchDB | IndexedDB 封装 | 本地数据库，存储笔记和元数据 |\n| CouchDB | 远程数据库 | 云端存储，多设备同步 |\n| FileSystem | Obsidian Vault API | 用户可见的文件系统 |\n\n## 数据流架构\n\n### 正常同步流程\n\n```mermaid\nsequenceDiagram\n    participant User as 用户\n    participant FS as 文件系统\n    participant Watcher as StorageEventManager\n    participant PDB as PouchDB\n    participant Rep as Replicator\n    participant CDB as CouchDB\n    \n    User-\u003e\u003eFS: 编辑 note.md\n    FS-\u003e\u003eWatcher: 触发 modify 事件\n    Watcher-\u003e\u003ePDB: 保存到本地\n    PDB--\u003e\u003eWatcher: 确认\n    \n    Note over Rep: 持续监听 PouchDB 变更\n    PDB-\u003e\u003eRep: 检测到新变更\n    Rep-\u003e\u003eCDB: 推送变更\n    CDB--\u003e\u003eRep: 确认接收\n    \n    Note over Rep: 定期拉取远程变更\n    Rep-\u003e\u003eCDB: 拉取变更\n    CDB--\u003e\u003eRep: 返回其他设备的变更\n    Rep-\u003e\u003ePDB: 保存远程变更\n    PDB-\u003e\u003eFS: 更新文件系统\n    FS--\u003e\u003eUser: 看到其他设备的更新\n```\n\n### 离线模式数据流\n\n```mermaid\nsequenceDiagram\n    participant User as 用户\n    participant FS as 文件系统\n    participant Watcher as StorageEventManager\n    participant PDB as PouchDB\n    participant Tracker as OfflineTracker\n    participant Rep as Replicator\n    participant CDB as CouchDB\n    \n    Note over Rep: 检测到服务器不可达\n    Rep-\u003e\u003eTracker: setOffline(true)\n    \n    User-\u003e\u003eFS: 编辑 note.md\n    FS-\u003e\u003eWatcher: 触发 modify 事件\n    Watcher-\u003e\u003ePDB: 保存到本地\n    Watcher-\u003e\u003eTracker: 记录待同步变更\n    PDB--\u003e\u003eUser: 本地保存成功\n    \n    Note over Rep: 10秒后尝试重连\n    Rep-\u003e\u003eCDB: 尝试连接\n    CDB--\u003e\u003eRep: 连接成功\n    \n    Rep-\u003e\u003eTracker: getPendingChanges()\n    Tracker--\u003e\u003eRep: 返回待同步列表\n    Rep-\u003e\u003eCDB: 推送所有待同步变更\n    CDB--\u003e\u003eRep: 确认\n    Rep-\u003e\u003eTracker: setOffline(false)\n```\n\n## 核心组件详解\n\n### LiveSyncReplicator\n\n复制器是同步功能的核心，负责在本地 PouchDB 和远程 CouchDB 之间同步数据。\n\n```typescript\nexport class LiveSyncCouchDBReplicator extends LiveSyncAbstractReplicator {\n    // 单次同步\n    async openOneShotReplication(\n        setting: RemoteDBSettings,\n        showResult: boolean,\n        syncMode: \"sync\" | \"pullOnly\" | \"pushOnly\"\n    ): Promise\u003cboolean\u003e {\n        // 1. 确保 PBKDF2 salt\n        await this.ensurePBKDF2Salt(setting);\n        \n        // 2. 检查 salt 一致性\n        await this.checkSaltConsistency(setting);\n        \n        // 3. 执行同步\n        await this.performReplication(syncMode);\n    }\n    \n    // 持续同步\n    async openReplication(\n        setting: RemoteDBSettings,\n        keepAlive: boolean,\n        showResult: boolean\n    ): Promise\u003cboolean\u003e {\n        // 启动双向实时同步\n        this.startLiveReplication();\n    }\n}\n```\n\n**关键职责**:\n- PBKDF2 盐值验证\n- 数据库一致性检查\n- 单次/持续同步\n- 冲突解决\n\n### FridayLocalDB\n\n本地数据库管理器，封装 PouchDB 操作。\n\n```typescript\nexport class FridayLocalDB {\n    private db: PouchDB.Database;\n    \n    // 初始化数据库\n    async initializeDatabase(\n        vaultName: string,\n        passphrase: string\n    ): Promise\u003cboolean\u003e {\n        this.db = new PouchDB(vaultName, {\n            adapter: 'indexeddb',\n            auto_compaction: true\n        });\n    }\n    \n    // CRUD 操作\n    async get(id: string): Promise\u003cDocument | null\u003e;\n    async put(doc: Document): Promise\u003cboolean\u003e;\n    async remove(doc: Document): Promise\u003cboolean\u003e;\n    \n    // 批量操作\n    async bulkDocs(docs: Document[]): Promise\u003cboolean\u003e;\n    \n    // 查询\n    async allDocs(options?: any): Promise\u003cDocument[]\u003e;\n    async query(filter: any): Promise\u003cDocument[]\u003e;\n}\n```\n\n### StorageEventManager\n\n文件系统监听器，检测 Obsidian vault 中的文件变更。\n\n```typescript\nexport class FridayStorageEventManager {\n    private _isWatching = false;\n    \n    beginWatch() {\n        this.app.vault.on('create', this.onFileCreate);\n        this.app.vault.on('modify', this.onFileModify);\n        this.app.vault.on('delete', this.onFileDelete);\n        this.app.vault.on('rename', this.onFileRename);\n        \n        this._isWatching = true;\n    }\n    \n    private async onFileModify(file: TFile) {\n        // 读取文件内容\n        const content = await this.app.vault.read(file);\n        \n        // 保存到 PouchDB\n        await this.localDB.put({\n            _id: file.path,\n            content: content,\n            mtime: file.stat.mtime\n        });\n    }\n}\n```\n\n\u003e [!warning] 防止循环更新\n\u003e \n\u003e `StorageEventManager` 需要小心处理自己触发的文件变更，避免无限循环。\n\n### ServerConnectivityChecker\n\n详见 [[server-connectivity|服务器连接性检查]] 文档。\n\n## 设计模式\n\nFriday 采用了多种设计模式来提高代码质量：\n\n### 1. 单例模式 (Singleton)\n\n```typescript\nexport class FridaySyncCore {\n    private static _instance: FridaySyncCore | null = null;\n    \n    static getInstance(app: App, plugin: Plugin): FridaySyncCore {\n        if (!this._instance) {\n            this._instance = new FridaySyncCore(app, plugin);\n        }\n        return this._instance;\n    }\n}\n```\n\n**用途**: 确保核心组件只有一个实例。\n\n### 2. 观察者模式 (Observer)\n\n```typescript\nexport class ReplicationStatus {\n    private observers: Array\u003c(status: SyncStatus) =\u003e void\u003e = [];\n    \n    subscribe(callback: (status: SyncStatus) =\u003e void) {\n        this.observers.push(callback);\n    }\n    \n    notify(status: SyncStatus) {\n        this.observers.forEach(cb =\u003e cb(status));\n    }\n}\n```\n\n**用途**: 状态变化通知（如同步状态更新）。\n\n### 3. 策略模式 (Strategy)\n\n```typescript\ninterface SyncStrategy {\n    sync(): Promise\u003cboolean\u003e;\n}\n\nclass OnlineSync implements SyncStrategy {\n    async sync(): Promise\u003cboolean\u003e {\n        // 在线同步逻辑\n    }\n}\n\nclass OfflineSync implements SyncStrategy {\n    async sync(): Promise\u003cboolean\u003e {\n        // 离线模式逻辑\n    }\n}\n\nclass SyncContext {\n    private strategy: SyncStrategy;\n    \n    setStrategy(strategy: SyncStrategy) {\n        this.strategy = strategy;\n    }\n    \n    async executeSync(): Promise\u003cboolean\u003e {\n        return await this.strategy.sync();\n    }\n}\n```\n\n**用途**: 根据网络状态选择不同的同步策略。\n\n### 4. 工厂模式 (Factory)\n\n```typescript\nexport class ReplicatorFactory {\n    static createReplicator(\n        type: 'couchdb' | 'memory',\n        env: LiveSyncReplicatorEnv\n    ): LiveSyncAbstractReplicator {\n        switch (type) {\n            case 'couchdb':\n                return new LiveSyncCouchDBReplicator(env);\n            case 'memory':\n                return new LiveSyncMemoryReplicator(env);\n            default:\n                throw new Error(`Unknown replicator type: ${type}`);\n        }\n    }\n}\n```\n\n**用途**: 创建不同类型的复制器。\n\n### 5. 适配器模式 (Adapter)\n\n```typescript\n// Obsidian Vault API 适配器\nexport class VaultAdapter {\n    constructor(private vault: Vault) {}\n    \n    // 统一的文件读取接口\n    async readFile(path: string): Promise\u003cstring\u003e {\n        const file = this.vault.getAbstractFileByPath(path);\n        if (file instanceof TFile) {\n            return await this.vault.read(file);\n        }\n        throw new Error('File not found');\n    }\n}\n```\n\n**用途**: 封装 Obsidian API，便于测试和替换。\n\n## 错误处理架构\n\nFriday 采用分层的错误处理策略：\n\n```mermaid\ngraph TD\n    E1[应用层错误] --\u003e H1[用户友好通知]\n    E2[业务层错误] --\u003e H2[日志记录 + 状态更新]\n    E3[网络层错误] --\u003e H3[重试 + 离线模式]\n    E4[存储层错误] --\u003e H4[数据恢复 + 警告]\n    \n    H1 --\u003e Logger[统一日志系统]\n    H2 --\u003e Logger\n    H3 --\u003e Logger\n    H4 --\u003e Logger\n```\n\n### 错误类型\n\n```typescript\n// 自定义错误类型\nexport class FridaySyncError extends Error {\n    constructor(\n        message: string,\n        public code: string,\n        public recoverable: boolean = true\n    ) {\n        super(message);\n        this.name = 'FridaySyncError';\n    }\n}\n\n// 具体错误\nexport class ServerUnreachableError extends FridaySyncError {\n    constructor() {\n        super('服务器不可达', 'SERVER_UNREACHABLE', true);\n    }\n}\n\nexport class EncryptionError extends FridaySyncError {\n    constructor(message: string) {\n        super(message, 'ENCRYPTION_ERROR', false);\n    }\n}\n```\n\n### 错误处理策略\n\n```typescript\ntry {\n    await this.syncOperation();\n} catch (error) {\n    if (error instanceof ServerUnreachableError) {\n        // 可恢复错误 - 进入离线模式\n        this.handleOfflineMode();\n    } else if (error instanceof EncryptionError) {\n        // 不可恢复错误 - 通知用户\n        showNotice('加密错误: ' + error.message);\n        this.setStatus('ERRORED');\n    } else {\n        // 未知错误 - 记录并通知\n        Logger(error, LOG_LEVEL_ERROR);\n        showNotice('未知错误，请查看日志');\n    }\n}\n```\n\n## 性能优化\n\n### 1. 增量同步\n\n只同步变更的部分，而不是整个数据库：\n\n```typescript\n// 使用 PouchDB 的 changes feed\nthis.db.changes({\n    since: 'now',\n    live: true,\n    include_docs: true\n}).on('change', (change) =\u003e {\n    // 只处理变更的文档\n    this.handleChange(change);\n});\n```\n\n### 2. 节流和防抖\n\n```typescript\nimport { debounce } from 'lodash-es';\n\nexport class FridayStorageEventManager {\n    // 防抖：文件修改后 500ms 才保存\n    private onFileModify = debounce(async (file: TFile) =\u003e {\n        await this.saveToLocalDB(file);\n    }, 500);\n}\n```\n\n### 3. 批量操作\n\n```typescript\n// 批量保存文档，减少数据库事务\nasync saveBatch(files: TFile[]) {\n    const docs = await Promise.all(\n        files.map(f =\u003e this.fileToDocument(f))\n    );\n    await this.db.bulkDocs(docs);\n}\n```\n\n### 4. 懒加载\n\n```typescript\n// 只在需要时初始化大型组件\nprivate _publishCore: FridayPublishCore | null = null;\n\nget publishCore(): FridayPublishCore {\n    if (!this._publishCore) {\n        this._publishCore = new FridayPublishCore(this.app, this.plugin);\n    }\n    return this._publishCore;\n}\n```\n\n### 5. 连接池和缓存\n\n```typescript\n// 服务器连接性检查结果缓存 5 秒\nprivate _lastCheckTime: number = 0;\nprivate _lastStatus: ServerStatus = \"UNKNOWN\";\nprivate _checkCooldown: number = 5000;\n\nasync checkConnectivity(): Promise\u003cServerStatus\u003e {\n    const now = Date.now();\n    if (now - this._lastCheckTime \u003c this._checkCooldown) {\n        return this._lastStatus; // 返回缓存结果\n    }\n    // 执行实际检查\n}\n```\n\n## 安全架构\n\n### 1. 端到端加密\n\n```mermaid\ngraph LR\n    Plain[明文笔记] --\u003e|PBKDF2| Key[加密密钥]\n    Key --\u003e|AES-256| Encrypted[加密内容]\n    Encrypted --\u003e|上传| CouchDB[(CouchDB)]\n    CouchDB --\u003e|下载| Encrypted2[加密内容]\n    Encrypted2 --\u003e|AES-256| Key2[加密密钥]\n    Key2 --\u003e|解密| Plain2[明文笔记]\n    \n    style Key fill:#f96,stroke:#333,stroke-width:2px\n    style Key2 fill:#f96,stroke:#333,stroke-width:2px\n```\n\n### 2. 密钥派生\n\n```typescript\n// 使用 PBKDF2 从密码派生密钥\nasync deriveKey(passphrase: string, salt: string): Promise\u003cCryptoKey\u003e {\n    const encoder = new TextEncoder();\n    const passphraseKey = await crypto.subtle.importKey(\n        'raw',\n        encoder.encode(passphrase),\n        'PBKDF2',\n        false,\n        ['deriveBits', 'deriveKey']\n    );\n    \n    return await crypto.subtle.deriveKey(\n        {\n            name: 'PBKDF2',\n            salt: encoder.encode(salt),\n            iterations: 100000,\n            hash: 'SHA-256'\n        },\n        passphraseKey,\n        { name: 'AES-GCM', length: 256 },\n        true,\n        ['encrypt', 'decrypt']\n    );\n}\n```\n\n### 3. 安全存储\n\n```typescript\n// 加密密码永不上传到服务器\n// 只存储在本地（Obsidian 设置）\nclass EncryptionManager {\n    private passphrase: string | null = null;\n    \n    // 从本地加载\n    loadPassphrase(): string | null {\n        return this.plugin.settings.encryptionPassphrase;\n    }\n    \n    // 保存到本地\n    savePassphrase(passphrase: string) {\n        this.plugin.settings.encryptionPassphrase = passphrase;\n        this.plugin.saveSettings();\n    }\n}\n```\n\n\u003e [!danger] 安全警告\n\u003e \n\u003e - 密码存储在本地的 Obsidian 设置文件中（未加密）\n\u003e - 不要在不信任的设备上使用\n\u003e - 定期更新密码\n\n## 测试架构\n\n### 单元测试\n\n```typescript\n// 使用 Jest 进行单元测试\ndescribe('ServerConnectivityChecker', () =\u003e {\n    it('should return REACHABLE when server responds', async () =\u003e {\n        const checker = new ServerConnectivityChecker();\n        const result = await checker.checkConnectivity(mockSettings);\n        expect(result.status).toBe('REACHABLE');\n    });\n    \n    it('should return UNREACHABLE when server is down', async () =\u003e {\n        const checker = new ServerConnectivityChecker();\n        fetchMock.mockReject(new Error('Connection failed'));\n        const result = await checker.checkConnectivity(mockSettings);\n        expect(result.status).toBe('UNREACHABLE');\n    });\n});\n```\n\n### 集成测试\n\n```typescript\n// 测试完整的同步流程\ndescribe('Sync Flow Integration', () =\u003e {\n    it('should sync file from device A to device B', async () =\u003e {\n        const deviceA = createTestDevice('A');\n        const deviceB = createTestDevice('B');\n        \n        // 设备 A 创建文件\n        await deviceA.vault.create('test.md', 'Hello World');\n        \n        // 等待同步\n        await wait(2000);\n        \n        // 设备 B 应该看到文件\n        const file = await deviceB.vault.read('test.md');\n        expect(file).toBe('Hello World');\n    });\n});\n```\n\n### E2E 测试\n\n使用 Playwright 进行端到端测试：\n\n```typescript\ntest('offline mode should save changes locally', async ({ page }) =\u003e {\n    // 登录\n    await page.goto('http://localhost:3000');\n    await login(page);\n    \n    // 断网\n    await page.context().setOffline(true);\n    \n    // 编辑文件\n    await page.fill('#editor', 'Offline edit');\n    \n    // 恢复网络\n    await page.context().setOffline(false);\n    \n    // 等待同步\n    await page.waitForSelector('.sync-success');\n    \n    // 验证另一设备能看到\n    await verifyOnOtherDevice('Offline edit');\n});\n```\n\n## 监控和日志\n\n### 日志系统\n\n```typescript\nexport enum LogLevel {\n    VERBOSE = 10,  // 详细调试信息\n    INFO = 20,     // 一般信息\n    NOTICE = 30,   // 用户可见通知\n    WARN = 40,     // 警告\n    ERROR = 50     // 错误\n}\n\nexport function Logger(\n    message: string,\n    level: LogLevel = LogLevel.INFO,\n    metadata?: any\n) {\n    const timestamp = new Date().toISOString();\n    const prefix = `[Friday ${LogLevel[level]}]`;\n    \n    console.log(`${timestamp} ${prefix} ${message}`, metadata);\n    \n    // 发送到远程监控（如果配置）\n    if (level \u003e= LogLevel.ERROR) {\n        sendToMonitoring(message, level, metadata);\n    }\n}\n```\n\n### 性能监控\n\n```typescript\nclass PerformanceMonitor {\n    measure(name: string, fn: () =\u003e Promise\u003cany\u003e): Promise\u003cany\u003e {\n        const start = performance.now();\n        return fn().finally(() =\u003e {\n            const duration = performance.now() - start;\n            Logger(`${name} took ${duration.toFixed(2)}ms`, LOG_LEVEL_VERBOSE);\n        });\n    }\n}\n\n// 使用\nawait perfMonitor.measure('sync', () =\u003e this.startSync());\n```\n\n## 可扩展性\n\nFriday 设计时考虑了未来的扩展：\n\n### 1. 插件系统（规划中）\n\n```typescript\ninterface FridayPlugin {\n    name: string;\n    version: string;\n    onLoad(): Promise\u003cvoid\u003e;\n    onUnload(): Promise\u003cvoid\u003e;\n}\n\nclass PluginManager {\n    private plugins: Map\u003cstring, FridayPlugin\u003e = new Map();\n    \n    async loadPlugin(plugin: FridayPlugin) {\n        await plugin.onLoad();\n        this.plugins.set(plugin.name, plugin);\n    }\n}\n```\n\n### 2. 存储后端抽象\n\n```typescript\ninterface StorageBackend {\n    save(id: string, content: string): Promise\u003cvoid\u003e;\n    load(id: string): Promise\u003cstring\u003e;\n    sync(): Promise\u003cvoid\u003e;\n}\n\nclass CouchDBBackend implements StorageBackend {\n    // CouchDB 实现\n}\n\nclass S3Backend implements StorageBackend {\n    // S3 实现\n}\n```\n\n### 3. 认证提供者\n\n```typescript\ninterface AuthProvider {\n    authenticate(credentials: any): Promise\u003cAuthToken\u003e;\n    refresh(token: AuthToken): Promise\u003cAuthToken\u003e;\n}\n\nclass LicenseAuthProvider implements AuthProvider {\n    // License Key 认证\n}\n\nclass OAuth2Provider implements AuthProvider {\n    // OAuth2 认证\n}\n```\n\n## 相关文档\n\n- [[sync-internals|同步机制内部原理]]\n- [[security-model|安全模型]]\n- [[data-flow|数据流和存储架构]]\n- [[server-connectivity|服务器连接性检查]]\n- [[offline-mode|离线模式]]\n\n## 技术栈\n\n| 层次 | 技术 | 用途 |\n|------|------|------|\n| 前端框架 | Obsidian Plugin API | 插件开发 |\n| UI 框架 | Preact / Svelte | 设置面板组件 |\n| 状态管理 | RxJS | 响应式状态管理 |\n| 本地数据库 | PouchDB | IndexedDB 封装 |\n| 远程数据库 | CouchDB | 云端同步 |\n| 加密 | Web Crypto API | 端到端加密 |\n| 网络请求 | Fetch API | HTTP 请求 |\n| 构建工具 | esbuild | 快速构建 |\n| 测试框架 | Jest + Playwright | 单元和 E2E 测试 |\n| 类型检查 | TypeScript | 类型安全 |\n| 代码检查 | ESLint | 代码质量 |\n\n## 开发指南\n\n想要贡献代码或开发扩展？查看这些资源：\n\n- [开发环境设置](./development-setup.md)\n- [代码规范](./coding-standards.md)\n- [提交指南](./contributing.md)\n- [API 文档](./api-reference.md)\n\n","tagNames":["架构","技术"],"links":["architecture/server-connectivity","sync-internals","security-model","data-flow","sync/offline-mode","development-setup","coding-standards","contributing","api-reference"],"tags":["tags/技术","tags/架构"]},"architecture/server-connectivity": {"slug":"architecture/server-connectivity","url":"https://share.mdfriday.com/s/GfifWM/architecture/server-connectivity.html","title":"服务器连接性检查","content":"---\ntitle: 服务器连接性检查\ndate: 2026-02-10\ntags:\n  - 同步\n  - 架构\n  - 网络\n---\n\nFriday 同步插件实现了智能的服务器连接性检查机制，能够在同步操作前验证服务器可达性，从而提供准确的错误归因和无缝的离线模式支持。\n\n## 为什么需要连接性检查？\n\n在没有预先检查服务器连接状态的情况下，同步失败可能会产生**误导性的错误消息**：\n\n- ❌ 服务器不可达时显示\"PBKDF2 加密失败\"\n- ❌ 网络问题被误判为\"数据库已重置\"\n- ❌ 本地文件修改在离线时丢失\n- ❌ 用户需要手动重启才能恢复同步\n\n有了服务器连接性预检查，Friday 能够：\n\n- ✅ 准确区分\"服务器不可达\"和\"同步错误\"\n- ✅ 在离线时自动启用[[offline-mode|离线模式]]\n- ✅ 始终保存本地文件修改到 PouchDB\n- ✅ 自动调度重连，无需手动干预\n\n\u003e [!info]\n\u003e 这个功能参考了 Self-hosted LiveSync 的网络检查机制，并进行了增强，提供了更好的用户体验。\n\n## 工作原理\n\n### 同步流程架构\n\n```mermaid\nsequenceDiagram\n    participant User as 用户\n    participant Core as FridaySyncCore\n    participant Checker as ServerConnectivityChecker\n    participant Server as CouchDB 服务器\n    participant FileWatcher as 文件监听器\n\n    User-\u003e\u003eCore: 开始同步\n    Core-\u003e\u003eChecker: checkConnectivity()\n    Checker-\u003e\u003eServer: 轻量级 ping\n    \n    alt 服务器可达\n        Server--\u003e\u003eChecker: 200 OK (或 401)\n        Checker--\u003e\u003eCore: REACHABLE ✅\n        Core-\u003e\u003eFileWatcher: 启动文件监听\n        Core-\u003e\u003eServer: 正常同步流程\n        Server--\u003e\u003eCore: 同步完成\n        Core--\u003e\u003eUser: 同步成功 ✓\n    else 服务器不可达\n        Server--xChecker: 连接失败\n        Checker--\u003e\u003eCore: UNREACHABLE ❌\n        Core-\u003e\u003eFileWatcher: 启动文件监听（离线模式）\n        Core-\u003e\u003eCore: scheduleReconnect(10s)\n        Core--\u003e\u003eUser: 离线模式 - 修改已保存到本地\n    end\n```\n\n### 分层架构\n\nFriday 的连接性检查采用清晰的分层架构：\n\n```\n┌─────────────────────────────────────────────────────────────────┐\n│                     入口层 (Entry Point)                         │\n│  - FridaySyncCore.startSync()                                   │\n│  - 所有同步操作的唯一入口                                         │\n└─────────────────────────────────────────────────────────────────┘\n                              │\n                              ▼\n┌─────────────────────────────────────────────────────────────────┐\n│              服务器连接性层 (Server Connectivity)                 │\n│  - ServerConnectivityChecker.checkConnectivity()                │\n│  - 轻量级 ping，在所有同步操作前执行                              │\n│  - 为下游组件设置 serverReachable 状态                           │\n└─────────────────────────────────────────────────────────────────┘\n                              │\n              ┌───────────────┴───────────────┐\n              │                               │\n        服务器可达                       服务器不可达\n              │                               │\n              ▼                               ▼\n┌──────────────────────────┐    ┌──────────────────────────┐\n│   正常同步流程            │    │   离线模式                │\n│  - ensurePBKDF2Salt()    │    │  - startFileWatcher()    │\n│  - checkSaltConsistency()│    │  - offlineTracker.on()   │\n│  - openReplication()     │    │  - scheduleReconnect()   │\n└──────────────────────────┘    └──────────────────────────┘\n```\n\n## 核心组件\n\n### ServerConnectivityChecker\n\n`ServerConnectivityChecker` 是一个独立的类，负责轻量级的服务器可达性检查。\n\n#### 主要特性\n\n| 特性 | 说明 |\n|------|------|\n| 轻量级检查 | 仅发送 GET 请求到服务器根路径 |\n| 智能缓存 | 5 秒冷却时间，避免过度请求 |\n| 超时控制 | 10 秒超时，防止长时间等待 |\n| 状态追踪 | 维护 `REACHABLE`、`UNREACHABLE`、`UNKNOWN` 三种状态 |\n\n#### 使用示例\n\n```typescript\n// 创建检查器实例\nconst checker = new ServerConnectivityChecker();\n\n// 执行连接性检查（强制检查，忽略缓存）\nconst result = await checker.checkConnectivity(settings, true);\n\nif (result.status === \"REACHABLE\") {\n    console.log(`服务器可达，延迟: ${result.latency}ms`);\n    // 继续正常同步流程\n} else {\n    console.log(`服务器不可达: ${result.error}`);\n    // 进入离线模式\n}\n```\n\n\u003e [!tip]\n\u003e `checkConnectivity` 方法接受一个 `forceCheck` 参数。设置为 `true` 可以跳过缓存冷却，立即执行检查。这在关键操作（如开始同步）时很有用。\n\n### 服务器状态枚举\n\n```typescript\ntype ServerStatus = \"REACHABLE\" | \"UNREACHABLE\" | \"UNKNOWN\";\n```\n\n- **REACHABLE**: 服务器响应正常（包括 200 OK、401 Unauthorized、403 Forbidden）\n- **UNREACHABLE**: 连接失败、超时或其他网络错误\n- **UNKNOWN**: 尚未执行任何检查\n\n\u003e [!info]\n\u003e 为什么 401/403 也算作 `REACHABLE`？\n\u003e \n\u003e 因为服务器已经响应了请求，只是认证失败。这说明服务器是在线的，问题出在认证配置上，而不是网络连接。\n\n## 错误归因逻辑\n\n在引入服务器连接性检查后，Friday 能够准确区分不同类型的错误：\n\n### ensurePBKDF2Salt 错误处理\n\n```typescript\nasync ensurePBKDF2Salt(\n    setting: RemoteDBSettings,\n    showMessage: boolean = false\n): Promise\u003cboolean\u003e {\n    try {\n        const hash = await this.getReplicationPBKDF2Salt(setting);\n        if (hash.length == 0) {\n            throw new Error(\"PBKDF2 salt 为空\");\n        }\n        return true;\n    } catch (ex) {\n        // 检查服务器状态，避免误导性错误消息\n        const serverReachable = this.env.isServerReachable?.() ?? true;\n\n        if (!serverReachable) {\n            // 服务器不可达 - 这是网络问题，不是 PBKDF2 问题\n            // 不显示误导性的 \"PBKDF2 失败\" 消息\n            return false;\n        }\n\n        // 服务器可达但 PBKDF2 失败 - 这是真正的问题\n        if (showMessage) {\n            showNotice(\"无法获取 PBKDF2 salt\");\n        }\n        return false;\n    }\n}\n```\n\n### 错误对比表\n\n| 场景 | 之前的行为 | 现在的行为 |\n|------|-----------|-----------|\n| CouchDB 不可达 | ⚠️ ERRORED + \"PBKDF2 失败\" | ⏹️ NOT_CONNECTED + \"服务器不可达\" |\n| 文件监听器 | ❌ 失败时不启动 | ✅ 始终启动 |\n| 用户文件修改 | ❌ 未保存 | ✅ 保存到本地 PouchDB |\n| 重新连接 | ❌ 需要手动重启 | ✅ 自动调度 |\n| 真正的数据库重置 | ⚠️ 与网络错误混淆 | ✅ 清晰识别 |\n\n## 离线模式支持\n\n当检测到服务器不可达时，Friday 会自动进入[[offline-mode|离线模式]]。\n\n### 离线模式特性\n\n```typescript\nprivate handleOfflineMode(errorMessage?: string): boolean {\n    // 更新网络管理器状态\n    this._managers?.networkManager.setServerReachable(false);\n    this.setStatus(\"NOT_CONNECTED\", \"服务器不可达，离线模式\");\n\n    // 启动文件监听器 - 即使离线也保存修改\n    this.startFileWatcherIfNeeded();\n\n    // 启用离线追踪\n    if (this._offlineTracker) {\n        this._offlineTracker.setOffline(true);\n    }\n\n    // 调度重连（10 秒后）\n    this._connectionMonitor?.scheduleReconnect(10000);\n\n    // 显示用户友好的消息\n    showNotice(\"无法连接到服务器。修改将保存到本地。\");\n\n    return false;\n}\n```\n\n\u003e [!success] 离线模式的好处\n\u003e \n\u003e - **无数据丢失**: 所有修改都保存到本地 PouchDB\n\u003e - **无缝体验**: 用户可以继续工作，无需担心网络状态\n\u003e - **自动恢复**: 网络恢复后自动重连并同步\n\u003e - **透明反馈**: 清晰的状态指示和通知\n\n### 文件监听器管理\n\nFriday 确保文件监听器在**任何情况下**都会启动：\n\n```typescript\nprivate startFileWatcherIfNeeded(): void {\n    if (this._storageEventManager \u0026\u0026 !this._fileWatcherStarted) {\n        this._fileWatcherStarted = true;\n        const WATCH_DELAY_MS = 1500;\n        setTimeout(() =\u003e {\n            if (this._storageEventManager) {\n                this._storageEventManager.beginWatch();\n                Logger(\"文件监听器已启动 - 本地修改将被保存\");\n            }\n        }, WATCH_DELAY_MS);\n    }\n}\n```\n\n\u003e [!warning] 避免重复启动\n\u003e \n\u003e `_fileWatcherStarted` 标志防止文件监听器被多次启动，这可能导致事件重复处理和性能问题。\n\n## 实现细节\n\n### LiveSyncReplicatorEnv 接口扩展\n\n为了让所有同步组件都能访问服务器状态，我们扩展了 `LiveSyncReplicatorEnv` 接口：\n\n```typescript\nexport interface LiveSyncReplicatorEnv {\n    // ... 现有接口成员 ...\n\n    /**\n     * 检查服务器是否可达（由 FridaySyncCore 提供）\n     * 被复制器用于错误归因\n     */\n    isServerReachable?: () =\u003e boolean;\n}\n```\n\n### FridaySyncCore 集成\n\n`FridaySyncCore` 实现了这个接口，并提供服务器状态：\n\n```typescript\nexport class FridaySyncCore implements LiveSyncReplicatorEnv {\n    private _serverChecker: ServerConnectivityChecker | null = null;\n\n    get isServerReachable(): boolean {\n        return this._serverChecker?.isServerReachable ?? false;\n    }\n\n    async startSync(continuous: boolean = true): Promise\u003cboolean\u003e {\n        // 步骤 1: 服务器连接性预检查\n        const connectivityResult = await this._serverChecker?.checkConnectivity(\n            this._settings,\n            true  // 强制检查\n        );\n\n        if (connectivityResult?.status !== \"REACHABLE\") {\n            // 进入离线模式\n            return this.handleOfflineMode(connectivityResult?.error);\n        }\n\n        // 步骤 2-4: 继续正常同步流程\n        // ...\n    }\n}\n```\n\n### 连接超时安全网\n\n为了处理\"卡在 STARTED 状态\"的问题，Friday 实现了连接超时机制：\n\n```typescript\nprivate setupConnectionTimeout(): void {\n    const CONNECTION_TIMEOUT_MS = 30000; // 30 秒\n    setTimeout(() =\u003e {\n        const status = this.replicationStat.value.syncStatus;\n        if (status === \"STARTED\") {\n            Logger(\"连接超时 - 状态停留在 STARTED\");\n            this.setStatus(\"NOT_CONNECTED\", \"连接超时\");\n            this._managers?.networkManager.setServerReachable(false);\n            this._connectionMonitor?.scheduleReconnect(10000);\n        }\n    }, CONNECTION_TIMEOUT_MS);\n}\n```\n\n\u003e [!tip] 为什么需要超时检查？\n\u003e \n\u003e 某些网络环境下，连接可能\"挂起\"而不是明确失败。超时机制确保用户不会无限期等待。\n\n## 性能优化\n\n### 冷却机制\n\n为了避免过度频繁的服务器请求，`ServerConnectivityChecker` 实现了 5 秒冷却：\n\n```typescript\nasync checkConnectivity(\n    setting: RemoteDBSettings,\n    forceCheck: boolean = false\n): Promise\u003cConnectivityCheckResult\u003e {\n    const now = Date.now();\n    \n    // 检查冷却\n    if (!forceCheck \u0026\u0026 now - this._lastCheckTime \u003c this._checkCooldown) {\n        return { status: this._lastStatus };\n    }\n\n    // 执行实际检查\n    // ...\n}\n```\n\n### 浏览器网络状态\n\n在发送请求前，先检查 `navigator.onLine`：\n\n```typescript\n// 首先检查浏览器网络状态\nif (!navigator.onLine) {\n    this._lastStatus = \"UNREACHABLE\";\n    return { status: \"UNREACHABLE\", error: \"浏览器离线\" };\n}\n```\n\n\u003e [!info]\n\u003e `navigator.onLine` 并不完全可靠（可能返回 `true` 而实际无网络），但它提供了一个快速的第一层检查。\n\n## 国际化消息\n\nFriday 为服务器连接性相关的消息提供了多语言支持：\n\n### 英文 (en.json)\n\n```json\n{\n    \"fridaySync.error.cannotConnectServer\": \"Cannot connect to sync server. Your changes will be saved locally and synced when connection is restored.\",\n    \"fridaySync.error.serverTimeout\": \"Connection to sync server timed out. Will retry automatically.\",\n    \"fridaySync.status.offlineMode\": \"Offline mode - changes saved locally\",\n    \"fridaySync.status.reconnecting\": \"Reconnecting to sync server...\"\n}\n```\n\n### 中文 (zh.json)\n\n```json\n{\n    \"fridaySync.error.cannotConnectServer\": \"无法连接同步服务器。您的修改将保存在本地，恢复连接后会自动同步。\",\n    \"fridaySync.error.serverTimeout\": \"连接同步服务器超时。将自动重试。\",\n    \"fridaySync.status.offlineMode\": \"离线模式 - 修改已保存到本地\",\n    \"fridaySync.status.reconnecting\": \"正在重新连接同步服务器...\"\n}\n```\n\n## 调试和日志\n\n### 日志级别\n\nFriday 使用不同的日志级别记录连接性相关的事件：\n\n```typescript\n// 详细调试信息\nLogger(`服务器连接性检查通过 (${latency}ms)`, LOG_LEVEL_VERBOSE);\n\n// 一般信息\nLogger(\"服务器不可达: 离线模式已启用\", LOG_LEVEL_INFO);\n\n// 用户可见通知\nLogger(\"无法连接到服务器。修改将保存到本地。\", LOG_LEVEL_NOTICE);\n```\n\n### 查看日志\n\n要查看详细的连接性检查日志：\n\n1. 打开 Obsidian 开发者控制台（`Ctrl+Shift+I` 或 `Cmd+Option+I`）\n2. 过滤 \"connectivity\" 或 \"server\"\n3. 查看详细的检查结果和延迟信息\n\n\u003e [!example] 日志示例\n\u003e \n\u003e ```\n\u003e [Friday] 服务器连接性检查通过 (45ms)\n\u003e [Friday] 文件监听器已启动 - 本地修改将被保存\n\u003e [Friday] 同步状态: CONNECTED\n\u003e ```\n\n## 最佳实践\n\n### 对于用户\n\n1. **保持网络稳定**: 虽然 Friday 支持离线模式，但稳定的网络连接能提供最佳体验\n2. **留意状态指示**: 关注状态栏的同步图标，了解当前连接状态\n3. **信任离线模式**: 离线时修改的文件会在重连后自动同步，无需担心\n\n### 对于开发者\n\n1. **使用 `isServerReachable`**: 在归因错误前，始终检查服务器状态\n2. **提供清晰的消息**: 根据 `isServerReachable` 返回不同的错误消息\n3. **优雅降级**: 设计功能时考虑离线场景\n4. **测试离线场景**: 使用浏览器的网络限制功能测试离线行为\n\n## 相关链接\n\n- [[offline-mode|离线模式详解]]\n- [[MDFriday/help/content/sync/encryption|加密密码管理]]\n- [[reset|同步问题排查]]\n- [[../../architecture/sync-internals|同步机制内部原理]]\n\n## 技术参考\n\n### 源代码文件\n\n| 组件 | 文件路径 | 关键方法 |\n|------|---------|---------|\n| 服务器检查器 | `src/sync/features/ServerConnectivity/index.ts` | `checkConnectivity()`, `pingServer()` |\n| 核心集成 | `src/sync/FridaySyncCore.ts` | `startSync()`, `handleOfflineMode()` |\n| PBKDF2 检查 | `src/sync/core/replication/LiveSyncAbstractReplicator.ts` | `ensurePBKDF2Salt()` |\n| 复制器 | `src/sync/core/replication/couchdb/LiveSyncReplicator.ts` | `openOneShotReplication()` |\n\n### 实现参考\n\n这个功能的设计参考了以下项目：\n\n- [Self-hosted LiveSync](https://github.com/vrtmrz/obsidian-livesync) - 网络检查和离线模式的灵感来源\n- [CouchDB Replication Protocol](https://docs.couchdb.org/en/stable/replication/protocol.html) - 复制协议规范\n\n","tagNames":["同步","架构","网络"],"links":["sync/offline-mode","MDFriday/help/content/sync/encryption","sync/reset","architecture/sync-internals"],"tags":["tags/网络","tags/架构","tags/同步"]},"categories": {"slug":"categories","url":"https://share.mdfriday.com/s/GfifWM/categories/index.html","title":"category","content":"","tagNames":[],"links":[],"tags":[]},"faq": {"slug":"faq","url":"https://share.mdfriday.com/s/GfifWM/faq.html","title":"常见问题","content":"---\ntitle: 常见问题\ndate: 2026-02-10\ntags:\n  - 常见问题\n---\n## 🎯 基础问题\n\n### Friday 是什么？\n\nFriday 是一个功能强大的 Obsidian 插件，提供两大核心功能：\n\n1. **安全同步**：在多台设备间同步笔记，采用端到端加密\n2. **一键发布**：将笔记转换为精美的网站、博客或文档\n\n了解更多：[[friday|关于 Friday]]\n\n### Friday 免费吗？\n\nFriday 采用 **Freemium** 模式：\n\n- 🆓 **免费版**：提供基础发布功能（不包含同步功能）\n- 💎 **付费版**：解锁全部功能，包括更大存储空间、高级主题、多种发布方式等\n- 👥 **团队版**：支持团队协作和管理\n\n查看详细的[定价方案](https://mdfriday.com/zh/pricing.html)。\n\n### 需要注册账号吗？\n\n**不需要**传统意义上的账号注册。\n\n你只需要一个 **激活码** 来激活功能。这个设计让你：\n- 不需要记住密码\n- 不需要绑定邮箱\n- 更好地保护隐私\n\n### 支持哪些平台？\n\nFriday 基于 Obsidian，支持所有 Obsidian 支持的平台：\n\n| 平台      | 状态  | 说明                             |\n| ------- | --- | ------------------------------ |\n| Windows | ✅   | 完全支持                           |\n| macOS   | ✅   | 完全支持                           |\n| Linux   | ✅   | 完全支持                           |\n| iOS     | ✅   | 通过 Obsidian Mobile - 目前只支持同步功能 |\n| Android | ✅   | 通过 Obsidian Mobile - 目前只支持同步功能 |\n\n## 🔐 同步相关\n\n### 数据存储在哪里？\n\nFriday 采用 **本地优先** 的设计：\n\n1. **本地存储**：\n   - 笔记文件：Obsidian vault（你的硬盘）\n   - 同步数据库：浏览器的 IndexedDB\n   \n2. **云端存储**：\n   - 使用 CouchDB 协议的云端服务器\n   - 所有数据在上传前已加密\n\n3. **谁能访问**：\n   - 本地数据：只有你\n   - 云端数据：加密后的，只有你能解密\n\n### 加密有多安全？\n\nFriday 使用 **端到端加密**（E2EE）：\n\n- **加密算法**：AES-256-GCM\n- **密钥派生**：PBKDF2（100,000 次迭代）\n- **加密位置**：数据在离开设备前就已加密\n- **密钥存储**：只在本地，从不上传\n\n\u003e [!success] 安全保证\n\u003e 即使：\n\u003e - ❌ 服务器被黑客攻击\n\u003e - ❌ 管理员恶意查看\n\u003e - ❌ 政府要求提供数据\n\u003e \n\u003e 没有你的加密密码，数据也无法被解密。\n\n了解更多：[[sync/encryption|加密密码管理]]\n\n### 忘记加密密码怎么办？\n\n\u003e [!danger] 无法恢复\n\u003e 加密密码是用来解密你的数据的唯一凭证。如果丢失，**无法恢复**云端数据。\n\n**如果你还有已配置的设备**：\n\n1. 打开 **设置 → Friday → 安全**\n2. 点击\"显示密码\"\n3. **立即保存**到安全的地方\n\n**如果完全丢失**：\n\n你需要：\n1. 重置同步配置\n2. 使用本地数据重新上传\n3. 获得新的加密密码\n4. 在所有设备上重新配置\n\n\u003e [!tip] 预防措施\n\u003e - 使用密码管理器（如 1Password、Bitwarden）\n\u003e - 写在纸上并妥善保管\n\u003e - 发送到自己的邮箱\n\u003e - 保存在多个地方\n\n### 离线可以使用吗？\n\n**完全可以！** Friday 的[[sync/offline-mode|离线模式]]让你在没有网络时也能正常工作：\n\n- ✅ 创建和编辑笔记\n- ✅ 删除和重命名文件\n- ✅ 所有修改保存到本地\n- ✅ 网络恢复后自动同步\n\n\u003e [!success] 真实场景\n\u003e - ✈️ 飞行中工作\n\u003e - 🚇 地铁中记录灵感\n\u003e - ☕ 咖啡馆网络不稳定\n\u003e \n\u003e 这些场景下 Friday 都能无缝工作。\n\n### 多台设备同时编辑会冲突吗？\n\n**可能会，但 Friday 有完善的冲突处理机制**：\n\n**冲突发生的情况**：\n- 多台设备同时编辑同一文件\n- 特别是在[[sync/offline-mode|离线模式]]下\n\n**冲突处理**：\n1. 保留最新的版本作为主文件\n2. 创建冲突副本：`filename (conflict YYYY-MM-DD).md`\n3. 你可以手动比较和合并\n\n**避免冲突**：\n- 尽量不要同时在多设备编辑同一文件\n- 频繁连接网络让设备同步\n- 使用不同的文件名前缀\n\n## 📝 发布相关\n\n### 发布的内容是公开的吗？\n\n**取决于你的选择**：\n\n- **快速分享**：生成一个公开链接，任何人知道链接都能访问\n- **私密发布**：需要密码才能访问（Pro 功能）\n- **私有笔记**：不发布，只在本地或同步设备间可见\n\n你可以随时更改发布状态。\n\n### 可以使用自己的域名吗？\n\n**可以！**（Pro 和 Team 版）\n\n1. 在 Friday 设置中配置自定义域名\n2. 在域名 DNS 中添加 CNAME 记录\n3. 等待 DNS 生效\n4. 完成设置\n\n示例：`notes.yourdomain.com`\n\n### 数据会丢失吗？\n\nFriday 采用多层保护：\n\n1. **本地文件**：始终保存在 Obsidian vault\n2. **本地数据库**：PouchDB 持久化存储\n3. **云端备份**：加密后的副本\n4. **版本历史**：保留修改记录（即将推出）\n\n\u003e [!danger] 建议额外备份\n\u003e 虽然 Friday 很可靠，但我们仍建议：\n\u003e - 定期备份，特别是重要文件\n\n### Friday 开源吗？\n\nFriday 插件采用 **部分开源** 策略：\n\n- ✅ **核心同步逻辑**：开源（参考 Self-hosted LiveSync）\n- ✅ **UI 组件**：开源\n- ❌ **激活码验证**：闭源\n- ❌ **高级功能**：部分闭源\n\n源代码：[GitHub 仓库](https://github.com/mdfriday/obsidian-friday-plugin)\n\n---\n\n**Happy note-taking! 📝✨**\n","tagNames":["常见问题"],"links":["friday","sync/encryption","sync/offline-mode"],"tags":["tags/常见问题"]},"friday": {"slug":"friday","url":"https://share.mdfriday.com/s/GfifWM/friday.html","title":"关于 Friday","content":"---\ntitle: 关于 Friday\ndate: 2026-02-11\ntags:\n  - 简介\n---\n\n\u003e [!quote] 你是创作者，也是拥有者\n\u003e \n\u003e **Friday 是一个面向知识创作者的「内容编译器与发布平台」，  \n\u003e 让一篇 Markdown 成为可部署的网站、演示文稿、文档与品牌资产。**\n\n## 🌟 为什么选择 Friday？\n\n### 一份内容，多种形式\n\n用 Markdown 写作，Friday 帮你制作成：\n\n- 📝 **个人博客** - 分享想法和见解\n- 📚 **知识文档** - 构建专业知识库\n- 🎨 **作品集** - 展示创作成果\n- 💼 **个人简历** - 打造专业形象\n- 🎬 **演示文稿** - 创建精美 PPT\n- 🚀 **产品官网** - 发布产品信息\n- 🏢 **企业站点** - 建立公司品牌\n\n### 你是创作者，也是拥有者\n\n```mermaid\ngraph LR\n    A[📝 Markdown 写作] --\u003e B[💾 本地存储]\n    B --\u003e C[🔐 加密同步]\n    C --\u003e D[☁️ 你的服务器]\n    D --\u003e E[🌐 你的域名]\n    E --\u003e F[👥 你的读者]\n    \n    style B fill:#90EE90,stroke:#333,stroke-width:2px\n    style D fill:#FFB6C1,stroke:#333,stroke-width:2px\n```\n\n**核心理念**：\n- ✅ 数据存储在你的设备上\n- ✅ 服务器可以自己搭建\n- ✅ 域名属于你自己\n- ✅ 内容完全由你控制\n\n## 🎯 核心功能\n\n### 1. 安全同步\n\n多设备间安全同步你的笔记，采用军事级加密。\n\n**特性**：\n- 🔒 [[sync/encryption|端到端加密]]（AES-256-GCM）\n- 🌐 [[sync/offline-mode|离线模式]] - 断网也能工作\n- ⚡ 增量同步 - 只同步变更部分\n- 🔄 实时同步 - 修改自动推送\n- 🤖 [[sync/server-connectivity|智能连接管理]] - 自动重连\n\n了解更多：[[sync/intro|同步功能介绍]]\n\n### 2. 站点发布\n\n将 Markdown 转换为精美的网站，一键部署。\n\n**发布方式**：\n\n| 方式                                | 适用场景  | 特点   |                         |\n| --------------------------------- | ----- | ---- | ----------------------- |\n| [[publish/quick-share\\|快速分享]]     | 快速分享  | 临时分享 | 一键生成链接                  |\n| [[publish/subdomain\\|二级域名]]       | 二级域名  | 个人站点 | `yourname.mdfriday.com` |\n| [[publish/custom-domain\\|自定义域名]]  | 自定义域名 | 专业站点 | `notes.yourdomain.com`  |\n| [[publish/enterprise-domain企业域名]] | 企业域名  | 企业官网 | `yourdomain.com`        |\n\n### 3. 海量主题生态\n\nFriday 完全重写了 HUGO 的核心代码（使用 TypeScript），因此能够**快速适配 HUGO 主题生态**。\n\n\u003e [!success] 背靠 HUGO 社区\n\u003e \n\u003e HUGO 是世界上最流行的静态网站生成器，拥有 **500+ 精美主题** 和活跃的社区。\n\u003e \n\u003e Friday 让你无需学习 HUGO，就能享受这个强大的生态系统！\n\n**主题类型**：\n\n- 📚 [[themes/wiki|知识库]] - 如 Obsidian Publish\n- 📖 [[themes/document|文档]] - 如 GitBook\n- ✍️ [[themes/blog|博客]] - 如 Medium\n- 🎨 [[themes/portfolio|作品集]] - 展示创意\n- 💼 [[themes/resume|简历]] - 专业形象\n- 🎬 [[themes/ppt|PPT]] - 演示文稿\n- 🚀 [[themes/landing|产品官网]] - 单页营销\n- 🏢 [[themes/enterprise|企业站]] - 公司门户\n\n浏览所有主题：[[themes/community|社区主题库]]\n\n## 🏗️ 技术架构\n\n### 创新：TS 重写 HUGO 核心\n\n```mermaid\ngraph TB\n    subgraph \"传统 HUGO\"\n        H1[Go 语言]\n        H2[命令行工具]\n        H3[本地生成]\n    end\n    \n    subgraph \"Friday 方案\"\n        F1[TypeScript 重写]\n        F2[Obsidian 集成]\n        F3[云端 + 本地生成]\n    end\n    \n    HUGO[HUGO 主题生态] --\u003e F1\n    F1 --\u003e F4[500+ 主题兼容]\n    F2 --\u003e F5[无缝体验]\n    F3 --\u003e F6[灵活部署]\n    \n    style F1 fill:#f96,stroke:#333,stroke-width:2px\n```\n\n**优势**：\n\n| 特性 | 传统 HUGO | Friday |\n|------|----------|--------|\n| 学习曲线 | 需学习 HUGO | 零学习成本 |\n| 编辑器 | 任意编辑器 | Obsidian 原生 |\n| 主题生态 | 500+ | 完全兼容 |\n| 预览方式 | 本地命令行 | [[publish/preview|可视化预览]] |\n| 部署方式 | 手动/CI | [[publish/quick-share|一键发布]] |\n| 协作 | Git | [[sync/intro|实时同步]] |\n\n### 架构图\n\n```mermaid\ngraph TB\n    subgraph \"创作层\"\n        A[Obsidian 编辑器]\n    end\n    \n    subgraph \"Friday 核心\"\n        B[MDFriday 引擎]\n        C[同步系统]\n        D[发布系统]\n    end\n    \n    subgraph \"主题层\"\n        E[HUGO 主题生态]\n        F[500+ 社区主题]\n    end\n    \n    subgraph \"部署层\"\n        G[MDFriday 云平台]\n        H[私有化部署]\n    end\n    \n    A --\u003e B\n    A --\u003e C\n    B --\u003e D\n    E --\u003e B\n    F --\u003e B\n    D --\u003e G\n    D --\u003e H\n    \n    style B fill:#f96,stroke:#333,stroke-width:2px\n```\n\n了解更多：[[architecture/overview|架构详解]]\n\n\n## 🔐 安全与隐私\n\n### 本地优先\n\n```\n┌─────────────────────────────────────┐\n│       你的数据始终在本地              │\n│                                     │\n│  📁 Obsidian Vault (文件系统)       │\n│  💾 PouchDB (浏览器数据库)          │\n│                                     │\n│  云端/私有服务器仅用于同步和发布     │\n└─────────────────────────────────────┘\n```\n\n### 端到端加密\n\n```mermaid\nsequenceDiagram\n    participant User as 你的设备\n    participant Crypto as 加密层\n    participant Server as 服务器\n    \n    User-\u003e\u003eCrypto: 笔记内容（明文）\n    Crypto-\u003e\u003eCrypto: AES-256 加密\n    Crypto-\u003e\u003eServer: 加密数据\n    \n    Note over Server: 服务器无法解密\u003cbr/\u003e你的数据\n    \n    Server-\u003e\u003eCrypto: 下载加密数据\n    Crypto-\u003e\u003eCrypto: 使用密码解密\n    Crypto-\u003e\u003eUser: 笔记内容（明文）\n```\n\n**安全保证**：\n- ✅ 密码只存储在本地\n- ✅ 服务器看不到明文\n- ✅ 符合 GDPR 标准\n\n了解更多：[[sync/encryption|加密详解]] • [[architecture/security-model|安全模型]]\n\n### 开源贡献\n\nFriday 基于优秀的开源项目：\n\n- [Self-hosted LiveSync](https://github.com/vrtmrz/obsidian-livesync) - 同步核心\n- [HUGO](https://gohugo.io/) - 主题生态\n- [PouchDB](https://pouchdb.com/) - 本地数据库\n\n我们也回馈社区，部分代码已开源。\n\n## 📄 法律信息\n\n- [使用条款](https://mdfriday.com/terms)\n- [隐私政策](https://mdfriday.com/privacy)\n- [数据处理协议](https://mdfriday.com/dpa)\n\n**你是创作者，也是拥有者。开始创作吧！🚀**\n","tagNames":["简介"],"links":["sync/encryption","sync/offline-mode","sync/server-connectivity","sync/intro","publish/quick-share","publish/subdomain","publish/custom-domain","publish/enterprise-domain企业域名","themes/wiki","themes/document","themes/blog","themes/portfolio","themes/resume","themes/ppt","themes/landing","themes/enterprise","themes/community","publish/preview","architecture/overview","architecture/security-model"],"tags":["tags/简介"]},"get-started": {"slug":"get-started","url":"https://share.mdfriday.com/s/GfifWM/get-started.html","title":"快速开始","content":"---\ntitle: 快速开始\ndate: 2026-02-11\ntags:\n  - 指南\n  - 快速开始\n---\n\n欢迎使用 Friday！本指南将在 5 分钟内帮你完成安装、激活和首次使用。\n\n## 📦 步骤 1：安装 Friday 插件\n\n### 方法 1：从 Obsidian 社区插件安装（推荐）\n\n1. 打开 Obsidian\n2. 进入 **设置 → 第三方插件**\n3. 关闭\"安全模式\"（如果未关闭）\n4. 点击 **浏览**\n5. 搜索 \"Friday\"\n6. 点击 **安装**\n7. 安装完成后，点击 **启用**\n\n### 方法 2：手动安装\n\n1. 从官方下载[最新版本](https://app.mdfriday.com/api/uploads/friday-latest.zip) ， 解压可得到 `main.js`，`manifest.json` 和 `style.css` 这三个文件。\n2. 将解压文件复制到 vault 的 `.obsidian/plugins/mdfriday/` 目录下，如果 mdfriday 不存在，则需要新建。\n3. 在 Obsidian 中重新加载插件\n4. 在第三方插件列表中启用 Friday\n\n\u003e [!info] 版本要求\n\u003e - Obsidian: v1.10.0 或更高版本\n\u003e - Friday: 最新稳定版本\n\n## 🎫 步骤 2：获取激活码\n\n### 购买渠道\n\n**国内用户**：\n- 🛒 [淘宝购买]([淘宝购买](https://item.taobao.com/item.htm?id=1021681636191\u0026mi_id=0000TP6GHQep6drq4_kU9DP4zK01apQ5i_06dEQlgeN7KZI\u0026skuId=6196046574887\u0026spm=a21xtw.29178619.0.0\u0026xxc=shop))（推荐）\n- [套餐介绍](https://mdfriday.com/zh/pricing.html)\n- [获取体验码](https://mdfriday.com/zh/tiyan.html)\n\n## 🔐 步骤 3：激活 License\n\n详细步骤请查看：[[license/activation|激活指南]]\n\n\n## 🔄 步骤 4：配置同步（可选）\n\n如果你需要多设备同步，按照以下步骤配置：\n\n### 第一台设备\n\n详细步骤：[[sync/settings#第一台设备设置|第一台设备设置]]\n\n1. 激活后，系统会自动生成**加密密码**\n2. **务必保存加密密码**（丢失无法恢复！只能重置，获取新的加密密码。）\n3. 点击\"上传本地到云端\"\n4. 等待上传完成\n\n\u003e [!danger] 极其重要！\n\u003e **请立即保存加密密码！**\n\u003e \n\u003e 保存方式：\n\u003e - 使用密码管理器（推荐）\n\u003e - 写在纸上妥善保管\n\u003e - 发送到自己的邮箱\n\n### 第二台设备\n\n详细步骤：[[sync/settings#第二台设备设置|第二台设备设置]]\n\n1. 在新设备上安装并启用 Friday\n2. 输入相同的激活码\n3. 输入之前保存的**加密密码**\n4. 点击\"从云端下载\"\n\n## 🚀 步骤 5：发布第一篇笔记\n\n### 方法 1：快速分享（最简单）\n\n1. 打开任意笔记\n2. 点击笔记右上角互联网图标，会自动构建预览，并帮助选中**Friday: 快速分享**\n3. 点击右侧功能栏里的**发布**按钮，获得公开访问链接\n\n详细说明：[[publish/quick-share|快速分享指南]]\n\n### 方法 2：使用二级域名\n\n1. 在 Friday 设置中配置二级域名\n2. 选择喜欢的[[themes/community|主题]]\n3. 点击发布\n4. 访问 `yourname.mdfriday.com`\n\n详细说明：[[publish/subdomain|二级域名发布]]\n\n### 方法 3：使用自定义域名\n\n1. 准备你自己的域名\n2. 在 DNS 中添加 A 记录，指向 `103.207.68.156`\n3. 在 Friday 设置中输入自己的域名，并检验 DNS 是否生效\n4. DNS 生效后，点击添加域名，等待 HTTPS 证书签发\n5. 点击 HTTPS 按钮查看证书签发状态，通常需要 1～2 分钟\n6. 证书准备好后，就可以在发布的时候选择自定义域名进行发布了\n\n详细说明：[[publish/custom-domain|自定义域名]]\n\n## 📚 学习路径\n\n### 新手路径\n\n```mermaid\ngraph LR\n    A[安装插件] --\u003e B[获取激活码]\n    B --\u003e C[激活]\n    C --\u003e D{需要同步?}\n    D --\u003e|是| E[配置同步]\n    D --\u003e|否| F[直接发布]\n    E --\u003e F\n    F --\u003e G[选择主题]\n    G --\u003e H[开始创作]\n```\n\n**推荐顺序**：\n\n1. ✅ 完成本快速开始指南\n2. 📖 阅读 [[friday|关于 Friday]]\n3. 🔧 配置 [[sync/settings|同步设置]]\n4. 🚀 尝试 [[publish/quick-share|快速分享]]\n5. 🎨 浏览 [[themes/community|主题库]]\n\n### 进阶用户\n\n如果你已经熟悉基础功能：\n\n1. 🏗️ 了解 [[architecture/overview|架构设计]]\n2. 🔍 深入 [[sync/server-connectivity|服务器连接管理]]\n3. 🛠️ 掌握 [[sync/offline-mode|离线模式]]\n4. 💼 探索 [[publish/enterprise-domain|企业域名]]\n5. 🏢 考虑 [[license/custom|私有化部署]]\n\n\n## 🎉 开始创作！\n\n配置完成后，你就可以：\n\n1. 📝 **自由创作**：写笔记、文章、知识库\n2. 🔄 **自动同步**：修改自动同步到所有设备\n3. 🌐 **一键发布**：随时分享你的内容\n4. 🛡️ **安心使用**：端到端加密保护隐私\n\n\u003e [!success] 欢迎来到 Friday！\n\u003e \n\u003e 如果你喜欢 Friday，欢迎：\n\u003e - ⭐ 在 GitHub 给我们一个星标\n\u003e - 💬 加入 Discord 社区交流\n\u003e - 📝 分享你的使用心得\n","tagNames":["指南","快速开始"],"links":["[淘宝购买](https:/item.taobao.com/item.htmid=1021681636191-and-mi_id=0000TP6GHQep6drq4_kU9DP4zK01apQ5i_06dEQlgeN7KZI-and-skuId=6196046574887-and-spm=a21xtw.29178619.0.0-and-xxc=shop)","license/activation","sync/settings","publish/quick-share","themes/community","publish/subdomain","publish/custom-domain","friday","architecture/overview","sync/server-connectivity","sync/offline-mode","publish/enterprise-domain","license/custom"],"tags":["tags/快速开始","tags/指南"]},"license": {"slug":"license","url":"https://share.mdfriday.com/s/GfifWM/license/index.html","title":"激活码","content":"---\ntitle: \"激活码\"\n---\n","tagNames":[],"links":[],"tags":[]},"license/activation": {"slug":"license/activation","url":"https://share.mdfriday.com/s/GfifWM/license/activation.html","title":"激活","content":"---\ntitle: 激活\ndate: 2026-02-11\ntags:\n  - 激活\n  - 激活码\n---\n\n本指南将帮助你完成 Friday 激活码的激活流程。\n\n## 📋 激活前准备\n\n### 1. 确认已安装 Friday\n\n- ✅ Obsidian 版本 v1.10.0 或更高\n- ✅ Friday 插件已安装最新版本并启用\n- ✅ 网络连接正常\n\n如果还未安装，请查看：[[get-started|快速开始指南]]\n\n### 2. 获取激活码\n\n**国内用户**：\n- 🛒 [淘宝购买](https://item.taobao.com/item.htm?id=1021681636191)\n- 💳 [免费体验](https://mdfriday.com/zh/tiyan.html)\n\n查看套餐详情：[定价方案](https://mdfriday.com/zh/pricing.html)\n\n## 🔑 激活码格式\n\nFriday 的激活码格式为：\n\n```\nMDF-XXXX-XXXX-XXXX\n```\n\n示例：`MDF-A1B2-C3D4-E5F6`\n\n## 📝 激活步骤\n\n### 步骤 1：打开设置页面\n\n1. 打开 Obsidian\n2. 点击左下角的 **设置** ⚙️ 图标\n3. 在左侧菜单找到 **Friday**\n\n### 步骤 2：输入激活码\n\n1. 找到 **激活码** 区域\n2. 在输入框中输入你的激活码\n3. 格式：`MDF-XXXX-XXXX-XXXX`\n\n\u003e [!info] 输入提示\n\u003e - 可以直接粘贴 \n\n### 步骤 3：点击激活\n\n1. 点击 **激活** 按钮\n2. 等待网络验证（通常几秒钟）\n3. 看到成功提示\n\n\u003e [!success] 激活成功\n\u003e 激活成功后，你会看到：\n\u003e - License Key（部分遮掩显示）\n\u003e - 有效期至\n\u003e - 套餐类型（Free/Enjoy/Creator/Pro/Enterprise）\n\u003e - 存储用量\n\n## ✅ 激活成功后\n\n### 查看激活码信息\n\n激活成功后，设置页面会显示如下：\n\n![[activated.png]]\n\n**激活成功！开始使用 Friday 吧！🎉**\n\n## ❌ 激活失败？\n\n**可能原因**：\n- 激活码格式不正确\n- 激活码已被使用（如果是二手）\n- 激活码已过期\n- 网络连接问题（防火墙、代理）\n\n**解决方案**：\n- 检查激活码格式：`MDF-XXXX-XXXX-XXXX`\n- 确认是从官方渠道购买\n- 联系支持：support@mdfriday.com ，加入[微信群](https://mdfriday.com/zh/tiyan.html)寻求帮助\n\n\n\n","tagNames":["激活","激活码"],"links":["get-started"],"tags":["tags/激活码","tags/激活"]},"license/custom": {"slug":"license/custom","url":"https://share.mdfriday.com/s/GfifWM/license/custom.html","title":"Friday 私有化部署服务","content":"---\ntitle: Friday 私有化部署服务\ndate: 2026-02-11\ntags:\n  - 激活码\n  - 买断\n  - 企业\n---\n\nFriday 私有化部署让你完全掌控数据和服务，适合企业、团队和重视数据主权的个人用户。\n\n## 🏢 为什么选择私有化部署？\n\n### 完全掌控\n\n```mermaid\ngraph TB\n    subgraph \"云端版\"\n        C1[MDFriday 服务器]\n        C2[二级域名]\n        C3[共享资源]\n    end\n    \n    subgraph \"私有化部署\"\n        P1[你的服务器]\n        P2[你的域名]\n        P3[独享资源]\n    end\n    \n    User[用户] -.数据加密.-\u003e C1\n    User -.数据加密.-\u003e P1\n    \n    style P1 fill:#90EE90,stroke:#333,stroke-width:2px\n    style P2 fill:#FFB6C1,stroke:#333,stroke-width:2px\n    style P3 fill:#87CEEB,stroke:#333,stroke-width:2px\n```\n\n**核心优势**：\n\n| 特性 | 云端版 | 私有化部署 |\n|------|--------|----------|\n| 数据存储 | MDFriday 服务器 | ✅ 你的服务器 |\n| 域名 | 二级域名 | ✅ 根域名 + 子域名 |\n| 品牌 | Friday Logo | ✅ 去 Logo |\n| 控制权 | 端到端加密 | ✅ 完全自主 |\n| 激活码 | 1 个 | ✅ 20 个 |\n| 价格 | $8/月 | ✅ ¥998 买断 |\n\n### 适用场景\n\n\u003e [!success] 适合以下用户\n\u003e \n\u003e - 🏢 **企业用户**：需要数据自主可控\n\u003e - 👥 **团队**：多人协作，统一管理\n\u003e - 🔐 **隐私敏感**：对数据隐私有高要求\n\u003e - 💼 **专业创作者**：打造个人品牌\n\u003e - 🏫 **教育机构**：学校、培训机构\n\u003e - 🔧 **技术爱好者**：喜欢折腾技术\n\n## 📦 交付物清单\n\n### 1. 完整后台服务\n\n**MDFriday 完整后台系统**，包括：\n\n#### 同步服务\n- ✅ 自定义同步空间\n- ✅ 用户管理\n- ✅ 空间配额管理\n- ✅ 数据备份\n\n#### 发布服务\n- ✅ 站点构建引擎（TS 重写的 HUGO）\n- ✅ 域名管理\n- ✅ SSL 证书自动配置\n- ✅ CDN 加速\n\n#### 主题系统\n- ✅ 所有创作者主题\n- ✅ 所有免费社区主题\n- ✅ 主题管理面板\n- ✅ 去除 Friday Logo\n\n### 2. 20 个激活码\n\n**激活码分配**：\n\n| 类型 | 数量 | 权限 |\n|------|------|------|\n| 企业账号 | 1 个 | 根域名 + 自定义同步空间 |\n| 常规账号 | 19 个 | 子域名 + 自定义同步空间 |\n\n**企业账号特权**：\n- ✅ 可发布到根域名（如 `yourdomain.com`）\n- ✅ 更大的存储空间\n- ✅ 优先技术支持\n- ✅ 自定义品牌\n\n**常规账号权限**：\n- ✅ 可发布到子域名（如 `notes.yourdomain.com`）\n- ✅ 标准存储空间\n- ✅ 所有核心功能\n\n\u003e [!tip] 激活码用途\n\u003e 20 个激活码可以：\n\u003e - 分享给家人、朋友\n\u003e - 分配给团队成员\n\u003e - 用于不同项目\n\u003e - 灵活调整分配\n\n### 3. 升级服务\n\n**免费升级服务**：\n- ✅ 免费三次后端升级\n- ✅ 升级由 MDFriday 团队执行\n- ✅ 包含数据迁移和测试\n- ✅ 保证服务连续性\n\n**自助升级**：\n- ✅ 详细的自助升级文档\n- ✅ 升级脚本和工具\n- ✅ 版本检查和回滚\n- ✅ 技术支持群\n\n## 💰 价格与支付\n\n### 价格方案\n\n\u003e [!success] 早鸟价\n\u003e \n\u003e **¥998** （原价 ¥2,998）\n\u003e \n\u003e - 买断制，无月费\n\u003e - 包含所有功能\n\u003e - 20 个激活码\n\u003e - 免费 3 次升级\n\n### 性价比分析\n\n**vs 云端版**：\n\n| 对比项 | 云端版（年付） | 私有化部署 |\n|-------|--------------|----------|\n| 1 年费用 | $96 × 20 = $1,920 | ¥998 |\n| 2 年费用 | $3,840 | ¥998 |\n| 3 年费用 | $5,760 | ¥998 |\n| 域名 | 二级域名 | 根域名 |\n| Logo | 有 | 无 |\n\n\u003e [!tip] 回本计算\n\u003e 如果你有 20 人团队或家庭，使用云端版：\n\u003e - 每年费用：$96 × 20 = $1,920 ≈ ¥13,000\n\u003e - **2 个月即可回本！**\n\n### 发票\n\n- ✅ 可开具增值税发票（普通发票）\n- ✅ 类别：技术服务类\n- ✅ 企业或个人均可\n\n## 🔧 技术要求\n\n### 服务器要求\n\n**最低配置**：\n\n| 项目 | 要求 |\n|------|------|\n| 操作系统 | Ubuntu 22.04 LTS |\n| CPU | 2 核 |\n| 内存 | 2 GB |\n| 存储 | 20 GB SSD |\n| 带宽 | 1 Mbps |\n\n\u003e [!tip] 服务器购买建议\n\u003e \n\u003e **阿里云**（推荐）：\n\u003e - 轻量应用服务器\n\u003e - 99 元/年起\n\u003e - 香港/新加坡节点无需备案\n\u003e \n\u003e **腾讯云**：\n\u003e - 标准型 S5\n\u003e - 价格优惠\n\u003e - 国内需备案\n\n### 域名要求\n\n**域名注册**：\n- ✅ 要求腾讯云 DNSPod\n\n**DNS 要求**：\n- ✅ 目前仅支持腾讯云 DNSPod\n- ✅ 需要 API Token 权限\n- ✅ 自动配置 DNS 记录\n\n**备案要求**：\n- 国内服务器：需要备案\n- 香港/海外服务器：无需备案\n\n\u003e [!info] 为什么仅支持 DNSPod？\n\u003e \n\u003e 目前我们优先支持 DNSPod（腾讯云），因为：\n\u003e - DNS API 稳定可靠\n\u003e - 自动 SSL 证书配置\n\u003e - 域名管理方便\n\u003e \n\u003e 其他 DNS 提供商支持正在开发中。\n\n### 网络要求\n\n- ✅ 服务器需要公网 IP\n- ✅ 开放 80/443 端口\n- ✅ 支持 SSL 证书\n- ✅ 建议配置 CDN\n\n## 📋 交付流程\n\n### 完整流程图\n\n```mermaid\ngraph TB\n    A[客户付款 ¥998] --\u003e B[MDFriday 开具发票]\n    B --\u003e C[客户准备服务器]\n    B --\u003e D[客户准备域名]\n    C --\u003e E{服务器就绪?}\n    D --\u003e F{域名就绪?}\n    E --\u003e|是| G[提供服务器信息]\n    F --\u003e|是| H[提供域名信息]\n    G --\u003e I[MDFriday 开始部署]\n    H --\u003e I\n    I --\u003e J[配置同步服务]\n    J --\u003e K[配置发布服务]\n    K --\u003e L[配置主题系统]\n    L --\u003e M[测试验收]\n    M --\u003e N{测试通过?}\n    N --\u003e|是| O[交付激活码]\n    N --\u003e|否| I\n    O --\u003e P[提供文档和培训]\n    P --\u003e Q[完成交付]\n    \n    style A fill:#90EE90,stroke:#333,stroke-width:2px\n    style O fill:#FFB6C1,stroke:#333,stroke-width:2px\n    style Q fill:#87CEEB,stroke:#333,stroke-width:2px\n```\n\n\n---\n\n**你的数据，你的服务器，你的域名。完全掌控！🏢**\n","tagNames":["激活码","买断","企业"],"links":[],"tags":["tags/企业","tags/买断","tags/激活码"]},"publish/custom-domain": {"slug":"publish/custom-domain","url":"https://share.mdfriday.com/s/GfifWM/publish/custom-domain.html","title":"自定义域名","content":"---\ntitle: 自定义域名\ndate: 2026-02-11\ntags:\n  - 发布\n  - 自定义\n  - 域名\n---\n\n自定义域名让你使用自己的域名（如 `yourdomain.com`）发布内容，打造专业的个人品牌。\n\n## 🌐 什么是自定义域名？\n\n自定义域名使用你购买的域名：\n\n- **子域名**: `blog.yourdomain.com`\n- **根域名**: `yourdomain.com`（Pro/企业账号）\n\n\u003e [!example] 示例\n\u003e - `zhangsan.com`\n\u003e - `example.com`\n\n\n## ✨ 优势\n\n### 品牌价值\n\n- 🎯 **专业形象** - 更可信\n- 🔗 **品牌一致** - 统一域名\n- 📈 **SEO 友好** - 权重累积\n- 💼 **商业价值** - 可变现\n\n### 完全掌控\n\n- ✅ 你拥有域名\n- ✅ 随时可迁移\n- ✅ 无平台限制\n- ✅ 长期投资\n\n## 🚀 配置步骤\n\n### 前提条件\n\n- ✅ 已购买域名\n- ✅ 有 DNS 管理权限\n- ✅ Friday Pro 或以上套餐\n\n### 步骤 1：准备域名\n\n**购买域名**：\n- 国内：阿里云、腾讯云\n- 国外：GoDaddy、Namecheap\n\n\u003e [!tip] 域名选择\n\u003e \n\u003e **好的域名**：\n\u003e - `notes.zhangsan.com`\n\u003e - `tech-blog.com`\n\u003e - `design.studio`\n\u003e \n\u003e **避免**：\n\u003e - 过长的域名\n\u003e - 难以拼写\n\u003e - 容易混淆\n\n### 步骤 2：DNS 配置\n\n#### A 记录\n\n如果使用根域名（如 `yourdomain.com`）：\n\n```\n类型: A\n主机记录: @\n记录值: 103.207.68.156 (Friday 提供)\nTTL: 600\n```\n\n\u003e [!info] DNS 提供商\n\u003e \n\u003e **支持的 DNS**：\n\u003e - ✅ 腾讯云 DNSPod（推荐）\n\u003e - ✅ 阿里云 DNS\n\u003e - ✅ Cloudflare\n\u003e - ✅ 其他主流 DNS\n\n### 步骤 3：Friday 配置\n\n在 Friday 设置中：\n\n1. 进入 **发布 → 域名设置**\n2. 选择\"自定义域名\"\n3. 输入域名（如 `yourdomain.com`）\n4. 点击\"验证域名\"\n5. 等待 DNS 生效（通常 1~3 分钟）\n6. 点击添加域名，成功后，Friday 会自去申请证书\n7. 点击 HTTPS 按钮，查看证书是否准备好（通常 1～3分钟）\n\n\u003e [!success] 免费 SSL\n\u003e \n\u003e Friday 使用 Let's Encrypt 免费 SSL 证书：\n\u003e - ✅ 自动申请\n\u003e - ✅ 自动续期\n\u003e - ✅ 无需额外费用\n\n### 多站点支持\n\nPro 用户可以配置[[site-path|多个路径]]：\n\n| 域名                  | 用途   |\n| ------------------- | ---- |\n| `example.com/blog`  | 博客   |\n| `example.com/docs`  | 文档   |\n| `example.com/about` | 个人介绍 |\n","tagNames":["发布","自定义","域名"],"links":["publish/site-path"],"tags":["tags/域名","tags/自定义","tags/发布"]},"publish/subdomain": {"slug":"publish/subdomain","url":"https://share.mdfriday.com/s/GfifWM/publish/subdomain.html","title":"二级域名发布","content":"---\ntitle: 二级域名发布\ndate: 2026-02-11\ntags:\n  - 发布\n  - 域名\n  - 子域名\n---\n\n二级域名发布让你使用 `yourname.mdfriday.com` 格式的域名，无需购买域名即可拥有专属网址。\n\n## 🌐 什么是二级域名？\n\n二级域名格式：`yourname.mdfriday.com`\n\n- **yourname** - 你选择的名称\n- **mdfriday.com** - Friday 平台域名\n\n\u003e [!example] 示例\n\u003e - `zhangsan.mdfriday.com`\n\u003e - `mytech.mdfriday.com`\n\u003e - `design-blog.mdfriday.com`\n\n## ✨ 特点\n\n### 优势\n\n- ✅ **免费** - 无需购买域名\n- ✅ **即时** - 几分钟内生效\n- ✅ **HTTPS** - 自动配置 SSL\n- ✅ **专业** - 独立网址\n- ✅ **简单** - 无需 DNS 配置\n\n### 适合场景\n\n- 个人博客\n- 学习笔记\n- 项目文档\n- 技术分享\n\n## 🚀 使用步骤\n\n### 步骤 1：选择名称\n\n在 Friday 设置中：\n\n1. 进入 **发布 → 域名设置**\n2. 选择\"使用二级域名\"\n3. 输入你想要的名称\n\n\u003e [!tip] 命名建议\n\u003e \n\u003e **好的名称**：\n\u003e - ✅ 简短易记\n\u003e - ✅ 与内容相关\n\u003e - ✅ 无特殊字符\n\u003e \n\u003e **示例**：\n\u003e - `zhangsan` - 个人姓名\n\u003e - `techblog` - 内容主题\n\u003e - `design-notes` - 描述性\n\n### 步骤 2：检查可用性\n\n系统会实时检查名称是否可用：\n\n- ✅ **可用** - 可以使用\n- ❌ **已被使用** - 换一个名称\n- ⚠️ **不符合规范** - 调整名称\n\n\u003e [!info] 命名规则\n\u003e \n\u003e - 长度：3-32 个字符\n\u003e - 字符：小写字母、数字、连字符\n\u003e - 开头：必须是字母\n\u003e - 结尾：不能是连字符\n\n### 步骤 3：配置站点\n\n选择以下选项：\n\n**主题**：\n- 从[[../themes/community|主题库]]选择\n- 或使用默认主题\n\n**站点信息**：\n- 站点标题\n- 站点描述\n- 作者信息\n\n**其他设置**：\n- 评论系统\n- 统计代码\n- 社交链接\n\n### 步骤 4：发布\n\n1. 点击\"发布\"按钮\n2. 等待构建（通常 1-2 分钟）\n3. 访问你的站点\n\n## 📐 站点结构\n\n### URL 结构\n\n```\nyourname.mdfriday.com/\n├── / (首页)\n├── /posts/ (文章列表)\n├── /posts/article-1/ (文章详情)\n├── /about/ (关于页面)\n└── /tags/ (标签页面)\n```\n\n### 自定义路径\n\n可以自定义文章路径：\n\n```yaml\n# 文章 frontmatter\n---\ntitle: \"文章标题\"\nslug: \"custom-url\"\n---\n```\n\n访问地址：`yourname.mdfriday.com/posts/custom-url/`\n\n## 🎨 自定义\n\n### 基础自定义（免费）\n\n- 主题选择\n- 配色方案\n- Logo 和 Favicon\n- 站点信息\n\n### 高级自定义（Pro）\n\n- 自定义 CSS\n- 自定义 JavaScript\n- 修改模板\n- 高级功能\n\n## 📊 功能特性\n\n### 自动 HTTPS\n\n- ✅ 自动申请 SSL 证书\n- ✅ 强制 HTTPS 访问\n- ✅ 证书自动续期\n\n### CDN 加速\n\n- ⚡ 全球 CDN 节点\n- 🌍 就近访问\n- 📈 提升访问速度\n\n### 搜索引擎\n\n- 🔍 自动生成 sitemap\n- 🤖 SEO 优化\n- 📊 Google Analytics\n\n## 💰 费用\n\n| 功能 | Free | Pro |\n|------|------|-----|\n| 二级域名 | ✅ | ✅ |\n| HTTPS | ✅ | ✅ |\n| CDN | ✅ | ✅ |\n| 自定义主题 | ✅ | ✅ |\n| 去除水印 | ❌ | ✅ |\n| 自定义 CSS | ❌ | ✅ |\n| 高级统计 | ❌ | ✅ |\n\n## 🔄 管理\n\n### 修改内容\n\n1. 在 Obsidian 中修改\n2. 自动同步（如果开启同步）\n3. 重新发布（或自动发布）\n\n### 更换主题\n\n1. 在设置中选择新主题\n2. [[../publish/preview|本地预览]]\n3. 重新发布\n\n### 更改域名\n\n\u003e [!warning] 注意\n\u003e \n\u003e 更改二级域名会导致：\n\u003e - 旧链接失效\n\u003e - 搜索引擎排名重置\n\u003e - 需要通知订阅者\n\n**建议**：\n- 谨慎更改\n- 设置 301 重定向（联系支持）\n\n## 🆙 升级到自定义域名\n\n如果你购买了自己的域名，可以升级：\n\n1. 准备你的域名\n2. 按照[[custom-domain|自定义域名指南]]配置\n3. 迁移内容（无缝切换）\n\n\u003e [!tip] 迁移优势\n\u003e \n\u003e - 保留所有内容\n- 更专业的形象\n\u003e - SEO 权重更高\n\u003e - 完全掌控\n\n## 📈 SEO 优化\n\n### 元信息\n\n在文章中设置：\n\n```yaml\n---\ntitle: \"文章标题\"\ndescription: \"文章描述\"\nkeywords: [\"关键词1\", \"关键词2\"]\n---\n```\n\n### Sitemap\n\n自动生成：\n- `yourname.mdfriday.com/sitemap.xml`\n\n提交到：\n- Google Search Console\n- Bing Webmaster Tools\n\n### 社交分享\n\nOpen Graph 标签：\n\n```yaml\n---\ntitle: \"文章标题\"\nimage: \"social-share.jpg\"\n---\n```\n\n## ❓ 常见问题\n\n### Q: 可以更换二级域名吗？\n\n**A**: 可以，但建议谨慎\n\n- 更换后旧链接失效\n- 需要重新提交搜索引擎\n- 建议设置 301 重定向\n\n### Q: 支持多个二级域名吗？\n\n**A**: 取决于套餐\n\n- **Free**: 1 个\n- **Pro**: 3 个\n- **Team**: 10 个\n\n### Q: 二级域名有限制吗？\n\n**A**: 有一些限制\n\n- 流量限制（根据套餐）\n- 存储限制（根据套餐）\n- 功能限制（Free vs Pro）\n\n### Q: 可以转为自定义域名吗？\n\n**A**: 可以！\n\n随时可以升级到[[custom-domain|自定义域名]]，内容无缝迁移。\n\n## 🔗 相关文档\n\n- [[quick-share|快速分享]]\n- [[custom-domain|自定义域名]]\n- [[../themes/community|主题库]]\n- [[preview|本地预览]]\n\n**立即创建你的专属网址！🌐✨**\n\n","tagNames":["发布","域名","子域名"],"links":["themes/community","publish/preview","publish/custom-domain","publish/quick-share"],"tags":["tags/子域名","tags/域名","tags/发布"]},"sync": {"slug":"sync","url":"https://share.mdfriday.com/s/GfifWM/sync/index.html","title":"同步","content":"---\ntitle: 同步\n---\n\n","tagNames":[],"links":[],"tags":[]},"sync/confilict": {"slug":"sync/confilict","url":"https://share.mdfriday.com/s/GfifWM/sync/confilict.html","title":"同步问题排查","content":"---\ntitle: 同步问题排查\ndate: 2026-02-10\ntags:\n  - 同步\n  - 文件冲突\n---\n## 冲突文件\n\n**症状**: 出现 `filename (conflict YYYY-MM-DD).md` 文件\n\n**原因**: 多台设备同时修改了同一文件（特别是在[[offline-mode|离线模式]]下）\n\n**冲突如何产生**:\n\n```mermaid\nsequenceDiagram\n    participant A as 设备 A\n    participant Server as CouchDB\n    participant B as 设备 B\n    \n    Note over A,B: 初始状态: note.md rev 1-abc\n    \n    A-\u003e\u003eA: 离线编辑 note.md\n    B-\u003e\u003eB: 离线编辑 note.md\n    \n    Note over A: note.md rev 2-def (本地)\n    Note over B: note.md rev 2-xyz (本地)\n    \n    A-\u003e\u003eServer: 推送 rev 2-def\n    Server--\u003e\u003eA: 成功\n    \n    B-\u003e\u003eServer: 推送 rev 2-xyz\n    Server--\u003e\u003eB: 冲突！\n    \n    Note over Server: 保留 rev 2-def\u003cbr/\u003e创建冲突副本\n```\n\n**解决冲突**:\n\n1. **手动合并**（推荐）\n   - 打开原文件和冲突文件\n   - 比较内容\n   - 手动合并有价值的修改\n   - 删除冲突文件\n\n2. **使用合并工具**\n   ```bash\n   # 使用 diff 工具\n   diff note.md \"note (conflict 2026-02-10).md\"\n   \n   # 或使用图形化工具（如 Beyond Compare、WinMerge）\n   ```\n\n3. **选择一个版本**\n   - 决定保留哪个版本\n   - 删除另一个\n\n\u003e [!tip] 预防冲突\n\u003e \n\u003e - 尽量不要在多设备同时离线编辑同一文件\n\u003e - 频繁连接网络，让设备同步\n\u003e - 使用不同的文件名称前缀（如 `deviceA-note.md`、`deviceB-note.md`）\n\n","tagNames":["同步","文件冲突"],"links":["sync/offline-mode"],"tags":["tags/文件冲突","tags/同步"]},"sync/encryption": {"slug":"sync/encryption","url":"https://share.mdfriday.com/s/GfifWM/sync/encryption.html","title":"加密","content":"---\ntitle: 加密\ndate: 2026-02-11\ntags:\n  - 同步\n  - 加密\n  - 安全\n---\n\n加密密码是 Friday 同步中最重要的安全凭证。本文解释它的作用和注意事项。\n\n## 🔐 什么是加密密码？\n\n加密密码是一个 **24 位的随机字符串**，在你首次激活 License 时自动生成。\n\n示例格式：\n\n```\nAb3Cd5Ef7Gh9Ij1Kl3Mn5Op7\n```\n\n## 🛡️ 它的作用\n\n### 端到端加密\n\n```mermaid\ngraph LR\n    A[你的笔记] --\u003e|加密| B[加密数据]\n    B --\u003e C[云端存储]\n    C --\u003e D[加密数据]\n    D --\u003e|解密| E[其他设备]\n    \n    A -.使用密码.-\u003e B\n    D -.使用密码.-\u003e E\n    \n    style B fill:#f96,stroke:#333,stroke-width:2px\n    style D fill:#f96,stroke:#333,stroke-width:2px\n```\n\n| 阶段 | 说明 |\n|------|------|\n| 加密 | 笔记在上传前使用你的密码加密 |\n| 存储 | 云端只存储加密后的数据 |\n| 解密 | 下载时使用密码解密 |\n\n### 安全保证\n\n- **服务器无法查看**：即使服务器被攻破，攻击者也无法读取你的笔记\n- **只有你能解密**：密码只存储在你的设备上，从不上传\n- **强加密**：使用业界标准的加密算法（AES-256-GCM）\n\n## ⚠️ 为什么必须保存它\n\n\u003e [!danger] 密码丢失 = 数据丢失\n\u003e \n\u003e 加密密码从不上传到服务器或存储在云端。  \n\u003e 如果你丢失了密码，**没有任何方法可以恢复你的云端数据**。\n\n这是端到端加密的代价：\n\n| 传统同步 | Friday 同步 |\n|----------|-------------|\n| 服务商可以重置你的密码 | ✅ 只有你能访问数据 |\n| 服务商可以看到你的数据 | ✅ 服务商无法查看内容 |\n| 安全性依赖服务商 | ✅ 安全性由你掌控 |\n\n## 💾 如何安全保存\n\n### 密码管理器（最推荐）\n\n使用 1Password、Bitwarden、KeePass 等：\n\n**步骤**：\n1. 创建一个新条目，命名为 \"Friday 加密密码\"\n2. 将密码粘贴到密码字段\n3. 保存并同步到其他设备\n\n**优势**：\n- ✅ 加密存储\n- ✅ 多设备访问\n- ✅ 不会丢失\n- ✅ 安全性高\n\n\u003e [!tip] 推荐的密码管理器\n\u003e \n\u003e - **1Password** - 功能完善，易用\n\u003e - **Bitwarden** - 开源免费\n\u003e - **KeePass** - 完全离线\n\u003e - **LastPass** - 老牌产品\n\n## 👀 如何查看当前密码\n\n如果你已经激活但忘记保存：\n\n1. 打开 **设置 → Friday**\n2. 找到「安全」区域\n3. 点击「加密密码」旁边的 **显示密码** 按钮\n4. 复制并保存到安全的地方\n\n\u003e [!warning] 重要提醒\n\u003e \n\u003e 密码只在你的设备上可见。如果你更换设备或重装 Obsidian，你需要之前保存的密码。\n\n## ❓ 常见问题\n\n### Q：能更改加密密码吗？\n\n**A**：目前不支持直接更改。\n\n如果确实需要更改：\n1. 导出/备份所有数据到本地\n2. 重置同步\n3. 使用新密码重新上传\n\n\u003e [!tip] 建议\n\u003e 除非密码泄露或丢失，否则不建议进行重置操作，因为这会影响其它设备的同步，其它设备也需要跟着修改。\n\n### Q：所有设备的密码一样吗？\n\n**A**：是的！\n\n所有设备使用 **相同的加密密码**，这样它们才能互相解密数据。\n\n```mermaid\ngraph TB\n    Password[加密密码]\n    Password --\u003e D1[设备 A]\n    Password --\u003e D2[设备 B]\n    Password --\u003e D3[设备 C]\n    \n    D1 \u003c--\u003e|加密数据| Server[云端服务器]\n    D2 \u003c--\u003e|加密数据| Server\n    D3 \u003c--\u003e|加密数据| Server\n    \n    style Password fill:#f96,stroke:#333,stroke-width:2px\n```\n\n### Q：密码会过期吗？\n\n**A**：不会。\n\n加密密码没有过期日期。只要你的 License 有效，密码就能使用。\n\n### Q：可以分享密码吗？\n\n**A**：技术上可以，但不推荐。\n\n分享密码意味着：\n- ✅ 对方可以访问你的所有笔记\n- ✅ 对方可以修改你的笔记\n- ⚠️ 对方可以看到你的私密内容\n\n只在以下情况考虑：\n- 团队协作\n- 家庭成员\n- 完全信任的人\n\n### Q：忘记密码但有已同步的设备？\n\n**A**：可以找回！\n\n在任何一台已同步的设备上：\n1. 打开 Friday 设置\n2. 查看「加密密码」\n3. 点击「显示」\n4. **立即保存！**\n\n## 🛡️ 安全最佳实践\n\n### 保存策略\n\n\u003e [!success] 推荐的三层保护\n\u003e \n\u003e 1. **主要保存**：密码管理器（日常使用）\n\u003e 2. **备份保存**：加密笔记或文件（备用）\n\u003e 3. **离线保存**：纸质备份（最后保险）\n\n### 安全原则\n\n1. ✅ 激活后 **立即** 保存密码\n2. ✅ 使用密码管理器\n3. ✅ 做一个离线备份（纸质）\n4. ✅ 不要和 License Key 放在同一个地方\n5. ❌ 不要分享给不信任的人\n6. ❌ 不要保存在未加密的地方\n7. ❌ 不要只保存在一个地方\n\n## 📝 总结\n\n\u003e [!quote] 记住三点\n\u003e \n\u003e 1. **立即保存** - 激活后第一时间保存\n\u003e 2. **多处备份** - 至少两个地方保存\n\u003e 3. **安全存储** - 使用加密的方式保存\n\n**你的数据安全，由你的密码保护！🔐**\n","tagNames":["同步","加密","安全"],"links":[],"tags":["tags/安全","tags/加密","tags/同步"]},"sync/intro": {"slug":"sync/intro","url":"https://share.mdfriday.com/s/GfifWM/sync/intro.html","title":"简介","content":"---\ntitle: 简介\ndate: 2026-02-11\ntags:\n  - 同步\n  - 简介\n---\n\nFriday 的同步功能让你的笔记在多设备之间安全、实时地同步，采用端到端加密保护你的隐私。\n\n## 🌟 核心特性\n\n### 端到端加密\n\n```mermaid\nsequenceDiagram\n    participant D1 as 设备A\n    participant Crypto as 加密层\n    participant Server as 服务器\n    participant D2 as 设备B\n    \n    D1-\u003e\u003eCrypto: 笔记内容（明文）\n    Crypto-\u003e\u003eCrypto: AES-256加密\n    Crypto-\u003e\u003eServer: 加密数据\n    Note over Server: 无法解密你的内容\n    Server-\u003e\u003eD2: 下载加密数据\n    D2-\u003e\u003eCrypto: 使用密码解密\n    Crypto-\u003e\u003eD2: 笔记内容（明文）\n```\n\n**安全保证**：\n- 🔒 AES-256-GCM 加密算法\n- 🔑 PBKDF2 密钥派生（100,000 次迭代）\n- 🛡️ 密码只存储在本地，从不上传\n- ✅ 即使服务器被攻破，数据也安全\n\n了解更多：[[sync/encryption|加密详解]]\n\n### 多设备同步\n\n支持所有 Obsidian 支持的平台：\n\n| 平台 | 状态 | 说明 |\n|------|------|------|\n| 💻 Windows | ✅ | |\n| 🍎 macOS | ✅ | |\n| 🐧 Linux | ✅ | |\n| 📱 iOS | ✅ | Obsidian Mobile |\n| 🤖 Android | ✅ | Obsidian Mobile |\n\n**同步方式**：\n- ⚡ 实时同步 - 修改自动推送\n- 📶 增量同步 - 只同步变更部分\n- 🔄 双向同步 - 所有设备保持一致\n\n### 离线模式\n\n网络断开也能继续工作，详见：[[offline-mode|离线模式详解]]\n\n**特性**：\n- ✅ 自动检测网络状态\n- ✅ 离线修改保存到本地\n- ✅ 网络恢复后自动同步\n- ✅ [[server-connectivity|智能重连机制]]\n\n### 本地优先\n\n```\n┌─────────────────────────────────────┐\n│       你的数据始终在本地              │\n│                                     │\n│  📁 Obsidian Vault (文件系统)       │\n│  💾 PouchDB (浏览器数据库)          │\n│                                     │\n│  云端/私有服务器仅用于同步           │\n└─────────────────────────────────────┘\n```\n\n**优势**：\n- 💨 即时访问，无需等待网络\n- 🛡️ 数据掌握在自己手中\n- 📴 离线也能正常工作\n- 🔄 云端仅用于多设备同步\n\n## 🚀 快速开始\n\n### 第一台设备设置\n\n详细步骤：[[settings#第一台设备设置|第一台设备设置]]\n\n**简要步骤**：\n\n1. [[../license/activation|激活 License]]\n2. 系统自动生成加密密码\n3. **保存加密密码**（重要！）\n4. 点击\"上传本地到云端\"\n5. 等待上传完成\n\n\u003e [!danger] 极其重要！\n\u003e 加密密码是解密数据的唯一凭证，丢失后**无法恢复**！\n\u003e \n\u003e 请保存到：\n\u003e - 密码管理器（推荐）\n\u003e - 写在纸上妥善保管\n\u003e - 发送到自己的邮箱\n\n### 第二台设备设置\n\n详细步骤：[[settings#第二台设备设置|第二台设备设置]]\n\n**简要步骤**：\n\n1. 安装并启用 Friday\n2. 输入相同的激活码\n3. 输入之前保存的加密密码\n4. 点击\"从云端下载\"\n5. 等待下载完成\n\n## 🔧 工作原理\n\n### 同步流程\n\n```mermaid\ngraph TB\n    A[文件修改] --\u003e B[文件监听器检测]\n    B --\u003e C[保存到本地 PouchDB]\n    C --\u003e D{网络状态?}\n    D --\u003e|在线| E[加密]\n    D --\u003e|离线| F[标记待同步]\n    E --\u003e G[推送到服务器]\n    F --\u003e H[网络恢复]\n    H --\u003e E\n    G --\u003e I[其他设备拉取]\n    I --\u003e J[解密]\n    J --\u003e K[更新本地文件]\n```\n\n### 技术架构\n\nFriday 基于成熟的开源技术：\n\n| 组件 | 技术 | 用途 |\n|------|------|------|\n| 本地数据库 | PouchDB | 存储和索引 |\n| 远程数据库 | CouchDB | 云端同步 |\n| 加密 | Web Crypto API | 端到端加密 |\n| 同步核心 | Self-hosted LiveSync | 复制协议 |\n\n了解更多：[[../architecture/overview|架构详解]]\n\n## ⚙️ 同步设置\n\n详细配置请查看：[[settings|同步设置详解]]\n\n### 基础设置\n\n在 **设置 → Friday → 同步** 中：\n\n| 设置项 | 默认值 | 说明 |\n|-------|--------|------|\n| 自动同步 | 开启 | 文件修改后自动同步 |\n| 同步间隔 | 实时 | 检测变更的频率 |\n| 离线模式 | 自动 | 网络断开时自动启用 |\n\n### 高级设置\n\n| 设置项 | 默认值 | 说明 |\n|-------|--------|------|\n| 重连间隔 | 10秒 | 离线后多久尝试重连 |\n| 连接超时 | 30秒 | 连接服务器的超时时间 |\n| 详细日志 | 关闭 | 仅在调试时开启 |\n| 冲突处理 | 自动 | 冲突文件处理方式 |\n\n## 🔐 安全与隐私\n\n### 加密机制\n\n详见：[[sync/encryption|加密详解]]\n\n**加密流程**：\n\n1. 用户设置加密密码\n2. 使用 PBKDF2 派生密钥\n3. 使用 AES-256-GCM 加密数据\n4. 上传加密后的数据\n5. 其他设备下载并解密\n\n**密钥管理**：\n- ✅ 密钥只存储在本地\n- ✅ 每个设备独立存储\n- ✅ 定期更新 salt\n\n### 隐私保护\n\n- ✅ 服务器无法查看你的内容\n- ✅ 符合 GDPR 标准\n- ✅ 不收集个人信息\n- ✅ 数据可随时导出\n\n### 私有化部署\n\n如果你需要完全掌控数据：\n\n- 部署在你自己的服务器\n- 使用你自己的域名\n- 完全自主可控\n\n了解更多：[[../license/custom|私有化部署]]\n\n## 🌐 智能连接管理\n\nFriday 实现了智能的连接管理机制，详见：[[server-connectivity|服务器连接性检查]]\n\n### 特性\n\n- ✅ **自动检测**：定期检查服务器状态\n- ✅ **准确归因**：区分网络问题和同步错误\n- ✅ **自动重连**：网络恢复后自动连接\n- ✅ **连接缓存**：避免频繁检查\n\n### 连接状态\n\n| 状态 | 图标 | 说明 |\n|------|------|------|\n| CONNECTED | ✓ | 已连接，正常同步 |\n| STARTED | ↻ | 正在连接 |\n| NOT_CONNECTED | ⏸ | [[offline-mode\\|离线模式]] |\n| ERRORED | ⚠ | 发生错误 |\n| PAUSED | ⏹ | 已暂停 |\n\n## 📴 离线模式\n\n详细说明：[[offline-mode|离线模式详解]]\n\n### 工作方式\n\n```mermaid\nstateDiagram-v2\n    [*] --\u003e Online: 服务器可达\n    Online --\u003e Offline: 网络断开\n    Offline --\u003e Reconnecting: 10秒后\n    Reconnecting --\u003e Online: 连接成功\n    Reconnecting --\u003e Offline: 连接失败\n    \n    note right of Offline\n        - 保存修改到本地\n        - 标记待同步\n        - 继续工作\n    end note\n```\n\n### 离线能做什么\n\n✅ **完全可用**：\n- 创建和编辑笔记\n- 删除和重命名文件\n- 插入附件\n- 本地搜索\n\n⏸️ **暂时不可用**：\n- 实时同步到云端\n- 从其他设备拉取\n- 发布笔记\n\n## ❓ 常见问题\n\n### 同步速度慢？\n\n**可能原因**：\n- 网络速度慢\n- 文件数量多\n- 大型附件\n\n**解决方案**：\n- 使用更快的网络\n- 压缩图片附件\n- 首次同步需要时间，后续会快\n\n### 出现冲突文件？\n\n**原因**：\n- 多台设备同时编辑同一文件\n- 特别是在离线模式下\n\n**处理方式**：\n1. 打开原文件和冲突文件\n2. 比较内容\n3. 手动合并有价值的修改\n4. 删除冲突文件\n\n**预防措施**：\n- 尽量不要同时编辑\n- 频繁连接网络\n- 使用不同的文件名\n\n### 忘记加密密码？\n\n\u003e [!danger] 无法恢复\n\u003e 加密密码丢失后，云端数据**无法恢复**。\n\n**如果还有已配置的设备**：\n1. 在设置中查看密码\n2. 立即保存\n\n**如果完全丢失**：\n1. 使用本地数据重新上传\n2. 获得新的加密密码\n3. 在所有设备重新配置\n\n更多问题请查看故障排查文档（即将推出）。\n\n## 📊 同步统计\n\n在 Friday 设置中可以查看：\n\n- 📈 同步状态\n- 💾 存储用量\n- 📱 已激活设备列表\n- 🕐 最近同步时间\n- 📊 同步历史\n\n## 🔗 相关文档\n\n- [[settings|同步设置详解]]\n- [[sync/encryption|加密详解]]\n- [[server-connectivity|服务器连接管理]]\n- [[offline-mode|离线模式]]\n- [[../license/activation|License 激活]]\n- [[../license/custom|私有化部署]]\n- [[../architecture/overview|架构详解]]\n\n## 🎯 下一步\n\n- 📖 阅读 [[settings|同步设置详解]]\n- 🔐 了解 [[sync/encryption|加密机制]]\n- 🌐 探索 [[offline-mode|离线模式]]\n- 🚀 开始 [[../publish/quick-share|发布笔记]]\n\n**开始享受无缝的多设备创作体验！📱💻🎉**\n\n","tagNames":["同步","简介"],"links":["sync/encryption","sync/offline-mode","architecture/server-connectivity","sync/settings","license/activation","architecture/overview","license/custom","publish/quick-share"],"tags":["tags/简介","tags/同步"]},"sync/offline-mode": {"slug":"sync/offline-mode","url":"https://share.mdfriday.com/s/GfifWM/sync/offline-mode.html","title":"离线模式","content":"---\ntitle: 离线模式\ndate: 2026-02-10\ntags:\n  - 同步\n  - 离线\n  - 功能\n---\nFriday 的离线模式让你能够在没有网络连接的情况下继续工作，所有修改都会被安全保存，并在恢复连接后自动同步。\n\n## 什么是离线模式？\n\n离线模式是 Friday 的一个核心特性，它确保：\n\n- ✅ **零数据丢失**: 所有文件修改都保存到本地数据库\n- ✅ **无缝体验**: 无需手动操作，自动启用和退出\n- ✅ **自动恢复**: 网络恢复后自动重连并同步\n- ✅ **状态透明**: 清晰的提示让你知道当前状态\n\n\u003e [!tip]\n\u003e 离线模式不是你需要\"开启\"的设置 - 当 Friday 检测到服务器不可达时，它会自动启用。\n\n## 工作原理\n\n### 自动检测和切换\n\n```mermaid\nflowchart TD\n    Start[开始同步] --\u003e Check{检查服务器连接}\n    Check --\u003e|可达| Online[在线模式]\n    Check --\u003e|不可达| Offline[离线模式]\n    \n    Online --\u003e SaveRemote[保存到本地 + 同步到云端]\n    Offline --\u003e SaveLocal[仅保存到本地]\n    \n    SaveLocal --\u003e Monitor[监控网络状态]\n    Monitor --\u003e Wait{10秒后}\n    Wait --\u003e Retry[尝试重连]\n    Retry --\u003e Check2{连接成功?}\n    Check2 --\u003e|是| Sync[同步离线期间的修改]\n    Check2 --\u003e|否| Monitor\n    \n    Sync --\u003e Online\n```\n\n### 本地优先架构\n\nFriday 采用\"本地优先\"的设计理念：\n\n```\n┌─────────────────────────────────────────┐\n│         用户编辑文件                      │\n└─────────────────────────────────────────┘\n                  │\n                  ▼\n┌─────────────────────────────────────────┐\n│      文件监听器检测到变更                  │\n└─────────────────────────────────────────┘\n                  │\n                  ▼\n┌─────────────────────────────────────────┐\n│    立即保存到本地 PouchDB（IndexedDB）    │\n│    ✓ 无需网络                            │\n│    ✓ 即时完成                            │\n└─────────────────────────────────────────┘\n                  │\n          ┌───────┴───────┐\n          │               │\n      在线模式         离线模式\n          │               │\n          ▼               ▼\n    同步到云端        标记为待同步\n          │               │\n          └───────┬───────┘\n                  ▼\n          网络恢复后同步\n```\n\n\u003e [!info] 为什么选择本地优先？\n\u003e \n\u003e 传统的云同步工具在网络不可用时可能丢失数据。Friday 确保你的修改**首先**保存在本地，然后才考虑上传到云端。\n\n## 离线模式下的功能\n\n### ✅ 完全可用的功能\n\n在离线模式下，以下功能正常工作：\n\n| 功能 | 说明 |\n|------|------|\n| 📝 创建笔记 | 新笔记保存到本地，稍后同步 |\n| ✏️ 编辑笔记 | 所有修改立即保存到本地数据库 |\n| 🗑️ 删除笔记 | 删除操作记录在本地，稍后同步 |\n| 📁 重命名/移动 | 文件操作保存在本地 |\n| 🔍 本地搜索 | 搜索本地已下载的内容 |\n| 📎 插入附件 | 附件保存在本地，稍后同步 |\n\n### ⏸️ 暂时不可用的功能\n\n以下功能需要网络连接：\n\n- ☁️ 实时同步到云端\n- 📥 从其他设备拉取最新更改\n- 🌐 发布笔记到互联网\n- 🔄 冲突解决（需要服务器数据）\n\n\u003e [!warning] 关于冲突\n\u003e \n\u003e 如果你在多台设备上同时离线编辑同一文件，恢复连接后可能产生冲突。Friday 会智能处理这些冲突，但建议避免同时离线编辑相同内容。\n\n## 自动重连机制\n\n当检测到服务器不可达时，Friday 会自动调度重连：\n\n### 重连策略\n\n```mermaid\nstateDiagram-v2\n    [*] --\u003e Online: 初始连接成功\n    Online --\u003e Offline: 检测到断网\n    Offline --\u003e Reconnecting: 10秒后\n    Reconnecting --\u003e Online: 连接成功\n    Reconnecting --\u003e Offline: 连接失败\n    \n    note right of Reconnecting\n        重连时会：\n        1. 检查服务器可达性\n        2. 同步待处理的修改\n        3. 恢复实时同步\n    end note\n```\n\n### 重连行为\n\n- **第一次尝试**: 10 秒后\n- **后续尝试**: 每隔 10 秒\n- **成功后**: 立即同步所有待处理的修改\n- **失败后**: 继续调度下一次尝试\n\n## 状态指示\n\nFriday 通过多种方式指示当前的连接状态：\n\n### 状态栏图标\n\n| 图标 | 状态 | 说明 |\n|------|------|------|\n| ✓ | CONNECTED | 已连接，正常同步中 |\n| ↻ | STARTED | 正在连接服务器 |\n| ⏸ | NOT_CONNECTED | 离线模式 - 修改保存到本地 |\n| ⚠ | ERRORED | 发生错误 |\n| ⏹ | PAUSED | 同步已暂停 |\n\n### 通知消息\n\n进入离线模式时，你会看到：\n\n\u003e 💡 无法连接同步服务器。您的修改将保存在本地，恢复连接后会自动同步。\n\n恢复连接时，你会看到：\n\n\u003e ✅ 已重新连接到同步服务器。正在同步离线期间的修改...\n\n## 实际使用场景\n\n### 场景 1: 飞行中工作\n\n```\n1. 登机前，你的笔记已经完全同步\n2. 进入飞行模式\n3. Friday 检测到离线，自动启用离线模式\n4. 你在飞行中编辑了 10 篇笔记\n5. 所有修改保存在本地 PouchDB\n6. 落地后重新连接 WiFi\n7. Friday 自动重连并同步这 10 篇笔记\n8. 其他设备上也能看到更新\n```\n\n\u003e [!success]\n\u003e 整个过程无需任何手动操作！\n\n### 场景 2: 咖啡馆网络不稳定\n\n```\n1. 在咖啡馆连接到公共 WiFi\n2. 开始编辑笔记\n3. WiFi 突然断开\n4. Friday 检测到断网，切换到离线模式\n5. 你继续编辑（可能都没注意到断网）\n6. 几分钟后 WiFi 恢复\n7. Friday 自动重连并同步修改\n```\n\n\u003e [!tip]\n\u003e 即使网络频繁波动，你也能流畅工作，无需担心数据丢失。\n\n### 场景 3: 地铁中记录灵感\n\n```\n1. 在地铁中（无网络）\n2. 突然有灵感，打开 Obsidian\n3. Friday 已经处于离线模式\n4. 快速记录想法，创建新笔记\n5. 到达目的地，连接到 WiFi\n6. Friday 自动上传新笔记\n```\n\n## 数据一致性保证\n\n### PouchDB 的作用\n\nFriday 使用 [PouchDB](https://pouchdb.com/) 作为本地数据库：\n\n```\n用户文件系统        PouchDB (IndexedDB)       CouchDB 服务器\n     │                      │                        │\n     │   文件修改            │                        │\n     ├─────────────────────\u003e│                        │\n     │                      │   在线时同步             │\n     │                      ├───────────────────────\u003e│\n     │                      │                        │\n     │                      │   服务器不可达时        │\n     │   继续修改            │   仅保存到本地          │\n     ├─────────────────────\u003e│
